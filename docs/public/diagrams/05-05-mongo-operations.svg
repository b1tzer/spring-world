<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow10" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">MongoDB 操作方式选择</text>

  <!-- Decision -->
  <polygon points="200,80 320,120 200,160 80,120" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="200" y="115" text-anchor="middle" fill="#333" font-size="12">查询复杂度?</text>

  <!-- Simple CRUD -->
  <line x1="320" y1="95" x2="430" y2="65" stroke="#666" marker-end="url(#arrow10)"/>
  <text x="375" y="72" fill="#666" font-size="11">简单 CRUD</text>

  <rect x="435" y="45" rx="6" width="160" height="50" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="515" y="67" text-anchor="middle" fill="#333" font-weight="bold">MongoRepository</text>
  <text x="515" y="85" text-anchor="middle" fill="#666" font-size="11">方法名查询，类似 JPA</text>

  <!-- Complex -->
  <line x1="320" y1="120" x2="430" y2="120" stroke="#666" marker-end="url(#arrow10)"/>
  <text x="375" y="132" fill="#666" font-size="11">复杂条件</text>

  <rect x="435" y="100" rx="6" width="160" height="50" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="515" y="122" text-anchor="middle" fill="#333" font-weight="bold">MongoTemplate</text>
  <text x="515" y="140" text-anchor="middle" fill="#666" font-size="11">Query + Criteria 灵活拼接</text>

  <!-- Aggregation -->
  <line x1="320" y1="145" x2="430" y2="175" stroke="#666" marker-end="url(#arrow10)"/>
  <text x="375" y="170" fill="#666" font-size="11">聚合分析</text>

  <rect x="435" y="155" rx="6" width="160" height="50" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="515" y="177" text-anchor="middle" fill="#333" font-weight="bold">Aggregation</text>
  <text x="515" y="195" text-anchor="middle" fill="#666" font-size="11">Pipeline 聚合，类似 GROUP BY</text>

  <!-- Recommendation -->
  <rect x="640" y="80" rx="6" width="140" height="100" fill="#f5f5f5" stroke="#ddd"/>
  <text x="710" y="100" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">建议</text>
  <text x="710" y="120" text-anchor="middle" fill="#555" font-size="11">简单 CRUD</text>
  <text x="710" y="135" text-anchor="middle" fill="#555" font-size="11">→ MongoRepository</text>
  <text x="710" y="155" text-anchor="middle" fill="#555" font-size="11">复杂查询</text>
  <text x="710" y="170" text-anchor="middle" fill="#555" font-size="11">→ MongoTemplate</text>
</svg>
