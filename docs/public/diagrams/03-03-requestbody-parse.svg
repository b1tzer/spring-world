<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">@RequestBody 参数解析时序</text>

  <!-- Participants -->
  <rect x="30" y="50" width="120" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="90" y="73" text-anchor="middle" fill="#333">Controller 方法</text>
  <rect x="200" y="50" width="200" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="300" y="73" text-anchor="middle" fill="#333">RequestResponseBodyMethodProcessor</text>
  <rect x="460" y="50" width="160" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="540" y="73" text-anchor="middle" fill="#333">HttpMessageConverter</text>
  <rect x="680" y="50" width="100" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="730" y="73" text-anchor="middle" fill="#333">HttpServletRequest</text>

  <!-- Lifelines -->
  <line x1="90" y1="86" x2="90" y2="370" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="300" y1="86" x2="300" y2="370" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="540" y1="86" x2="540" y2="370" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="730" y1="86" x2="730" y2="370" stroke="#999" stroke-dasharray="4,4"/>

  <!-- 1: Controller -> RRRP -->
  <line x1="90" y1="120" x2="295" y2="120" stroke="#666" marker-end="url(#arrow4)"/>
  <text x="192" y="115" text-anchor="middle" fill="#333">resolveArgument()</text>

  <!-- 2: RRRP -> Request -->
  <line x1="300" y1="160" x2="725" y2="160" stroke="#666" marker-end="url(#arrow4)"/>
  <text x="512" y="155" text-anchor="middle" fill="#333">getContentType()</text>

  <!-- 3: RRRP -> itself -->
  <path d="M 300 200 L 370 200 L 370 220 L 300 220" fill="none" stroke="#666" marker-end="url(#arrow4)"/>
  <text x="380" y="214" fill="#333">查找匹配的 HttpMessageConverter</text>

  <!-- 4: RRRP -> HMC -->
  <line x1="300" y1="250" x2="535" y2="250" stroke="#666" marker-end="url(#arrow4)"/>
  <text x="417" y="245" text-anchor="middle" fill="#333">read(Class, request)</text>

  <!-- 5: HMC -> Request -->
  <line x1="540" y1="290" x2="725" y2="290" stroke="#666" marker-end="url(#arrow4)"/>
  <text x="632" y="285" text-anchor="middle" fill="#333">读取 InputStream</text>

  <!-- 6: HMC -> RRRP (return) -->
  <line x1="535" y1="330" x2="305" y2="330" stroke="#666" stroke-dasharray="4,4" marker-end="url(#arrow4)"/>
  <text x="420" y="325" text-anchor="middle" fill="#333">返回反序列化后的对象</text>

  <!-- 7: RRRP -> Controller (return) -->
  <line x1="295" y1="360" x2="95" y2="360" stroke="#666" stroke-dasharray="4,4" marker-end="url(#arrow4)"/>
  <text x="195" y="355" text-anchor="middle" fill="#333">返回参数值</text>
</svg>