<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
    <marker id="darrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999"/>
    </marker>
  </defs>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }</style>
  <!-- 客户端请求 -->
  <rect x="30" y="40" width="130" height="50" rx="6" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="95" y="70" text-anchor="middle">客户端请求</text>
  <!-- API 网关 -->
  <rect x="250" y="40" width="130" height="50" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="315" y="70" text-anchor="middle">API 网关</text>
  <!-- 订单服务 -->
  <rect x="470" y="40" width="130" height="50" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="535" y="70" text-anchor="middle">订单服务</text>
  <!-- 用户服务 -->
  <rect x="620" y="140" width="130" height="50" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="685" y="170" text-anchor="middle">用户服务</text>
  <!-- 数据库 -->
  <rect x="620" y="240" width="130" height="50" rx="6" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="685" y="270" text-anchor="middle">数据库</text>
  <!-- Zipkin -->
  <rect x="30" y="240" width="130" height="50" rx="6" fill="#f3e5f5" stroke="#ba68c8" stroke-width="1.5"/>
  <text x="95" y="270" text-anchor="middle">Zipkin</text>
  <!-- 主流程箭头 -->
  <line x1="160" y1="65" x2="250" y2="65" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="65" x2="470" y2="65" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="535" y1="90" x2="685" y2="140" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="685" y1="190" x2="685" y2="240" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 限流/熔断标注 -->
  <text x="315" y="28" text-anchor="middle" font-size="11" fill="#c62828">限流</text>
  <text x="535" y="28" text-anchor="middle" font-size="11" fill="#c62828">熔断</text>
  <text x="685" y="135" text-anchor="middle" font-size="11" fill="#c62828">熔断</text>
  <text x="685" y="235" text-anchor="middle" font-size="11" fill="#c62828">限流</text>
  <!-- traceId 虚线 -->
  <line x1="315" y1="90" x2="535" y2="90" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#darrow)"/>
  <text x="425" y="108" text-anchor="middle" font-size="10" fill="#999">traceId</text>
  <line x1="535" y1="110" x2="685" y2="140" stroke="#999" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#darrow)"/>
  <!-- Zipkin 收集 -->
  <line x1="160" y1="265" x2="250" y2="90" stroke="#ba68c8" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#darrow)"/>
  <line x1="160" y1="255" x2="470" y2="90" stroke="#ba68c8" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#darrow)"/>
  <line x1="160" y1="260" x2="620" y2="165" stroke="#ba68c8" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#darrow)"/>
  <text x="250" y="200" font-size="10" fill="#999">收集链路数据</text>
</svg>