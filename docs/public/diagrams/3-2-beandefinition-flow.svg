<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="df" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#666"/></marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">从注解到 BeanDefinition</text>

  <!-- Step 1: @Component -->
  <rect x="20" y="50" width="140" height="44" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="90" y="68" text-anchor="middle" fill="#333">@Component</text>
  <text x="90" y="85" text-anchor="middle" font-size="12" fill="#666">@Service / @Repository</text>

  <line x1="160" y1="72" x2="195" y2="72" stroke="#666" stroke-width="1.5" marker-end="url(#df)"/>
  <text x="178" y="64" font-size="11" fill="#999">扫描</text>

  <!-- Step 2: Scanner -->
  <rect x="200" y="50" width="160" height="44" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="280" y="68" text-anchor="middle" fill="#333">ClassPathBean</text>
  <text x="280" y="85" text-anchor="middle" font-size="12" fill="#666">DefinitionScanner</text>

  <line x1="360" y1="72" x2="395" y2="72" stroke="#666" stroke-width="1.5" marker-end="url(#df)"/>
  <text x="378" y="64" font-size="11" fill="#999">解析</text>

  <!-- Step 3: AnnotatedBeanDefinition -->
  <rect x="400" y="50" width="160" height="44" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="480" y="68" text-anchor="middle" fill="#333">AnnotatedBean</text>
  <text x="480" y="85" text-anchor="middle" font-size="12" fill="#666">Definition</text>

  <line x1="560" y1="72" x2="595" y2="72" stroke="#666" stroke-width="1.5" marker-end="url(#df)"/>
  <text x="578" y="64" font-size="11" fill="#999">注册</text>

  <!-- Step 4: Registry -->
  <rect x="600" y="50" width="170" height="44" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="685" y="68" text-anchor="middle" fill="#333">BeanDefinitionRegistry</text>
  <text x="685" y="85" text-anchor="middle" font-size="12" fill="#666">（菜谱柜）</text>

  <!-- Bottom: getBean -->
  <line x1="685" y1="94" x2="685" y2="125" stroke="#666" stroke-width="1.5" marker-end="url(#df)"/>
  <text x="693" y="112" font-size="11" fill="#999">getBean</text>

  <!-- Step 5: 实例化 Bean -->
  <rect x="600" y="125" width="170" height="44" rx="6" fill="#c8e6c9" stroke="#66bb6a" stroke-width="1.5"/>
  <text x="685" y="143" text-anchor="middle" font-weight="bold" fill="#333">实例化 Bean</text>
  <text x="685" y="160" text-anchor="middle" font-size="12" fill="#666">（开始做菜）</text>

  <!-- Bottom note -->
  <rect x="20" y="130" width="400" height="45" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="220" y="150" text-anchor="middle" font-size="12" fill="#555">菜谱先写好，做菜是后面的事</text>
  <text x="220" y="168" text-anchor="middle" font-size="12" fill="#555">BeanDefinition = Bean 的"描述"，Bean = 实际的"对象"</text>
</svg>