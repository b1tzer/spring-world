  <!-- Container -> Beans arrows -->
  <line x1="520" y1="100" x2="505" y2="140" stroke="#4caf50" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="560" y1="100" x2="560" y2="140" stroke="#4caf50" stroke-width="1.5" marker-end="url(#arrG)"/>
  <line x1="600" y1="100" x2="655" y2="140" stroke="#4caf50" stroke-width="1.5" marker-end="url(#arrG)"/>
