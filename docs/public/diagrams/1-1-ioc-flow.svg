  <text x="170" y="108" font-size="10" fill="#999">new</text>
  <text x="100" y="155" font-size="10" fill="#999">new</text>
  <text x="55" y="225" font-size="10" fill="#999">new</text>
  <text x="55" y="290" font-size="10" fill="#999">new</text>

