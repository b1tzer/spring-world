  <!-- Arrows left -->
  <line x1="70" y1="96" x2="70" y2="130" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="160" y1="96" x2="245" y2="130" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
