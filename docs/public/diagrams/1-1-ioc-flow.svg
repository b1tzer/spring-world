  <text x="530" y="125" font-size="11" fill="#4caf50">注入</text>

  <!-- Bottom note -->
  <text x="200" y="390" text-anchor="middle" font-size="12" fill="#999">每个对象自己创建依赖 → 耦合严重</text>
  <text x="600" y="330" text-anchor="middle" font-size="12" fill="#4caf50">容器统一管理 → 解耦清晰</text>
