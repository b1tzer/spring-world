<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }
    .node-blue { fill: #e3f2fd; stroke: #90caf9; stroke-width: 1.5; }
    .node-pink { fill: #fce4ec; stroke: #f48fb1; stroke-width: 1.5; }
    .node-green { fill: #e8f5e9; stroke: #a5d6a7; stroke-width: 1.5; }
    .node-orange { fill: #fff3e0; stroke: #ffcc80; stroke-width: 1.5; }
    .node-yellow { fill: #fffde7; stroke: #fff176; stroke-width: 1.5; }
    .node-purple { fill: #f3e5f5; stroke: #ce93d8; stroke-width: 1.5; }
    .diamond { fill: #fff3e0; stroke: #ffcc80; stroke-width: 1.5; }
    .line { stroke: #666; stroke-width: 1.5; marker-end: url(#arrow); }
    .label { font-size: 12px; fill: #888; }
  </style>

  <!-- 方法被调用 -->
  <rect x="310" y="15" width="180" height="40" rx="6" class="node-blue"/>
  <text x="400" y="40" text-anchor="middle">方法被调用</text>

  <!-- @Around 前置 -->
  <rect x="310" y="80" width="180" height="40" rx="6" class="node-pink"/>
  <text x="400" y="105" text-anchor="middle">@Around 前置</text>

  <!-- @Before -->
  <rect x="310" y="145" width="180" height="40" rx="6" class="node-blue"/>
  <text x="400" y="170" text-anchor="middle">@Before</text>

  <!-- 目标方法执行 (diamond) -->
  <polygon points="400,210 500,250 400,290 300,250" class="diamond"/>
  <text x="400" y="254" text-anchor="middle">目标方法执行</text>

  <!-- 正常返回分支 -->
  <line x1="500" y1="250" x2="600" y2="250" class="line"/>
  <text x="545" y="243" text-anchor="middle" class="label">正常返回</text>

  <rect x="600" y="230" width="160" height="40" rx="6" class="node-green"/>
  <text x="680" y="255" text-anchor="middle">@AfterReturning</text>

  <!-- 异常分支 -->
  <line x1="400" y1="290" x2="400" y2="320" class="line"/>
  <text x="410" y="310" class="label">抛出异常</text>

  <rect x="310" y="320" width="180" height="40" rx="6" class="node-orange"/>
  <text x="400" y="345" text-anchor="middle">@AfterThrowing</text>

  <!-- @After (汇聚) -->
  <line x1="680" y1="270" x2="680" y2="380" class="line"/>
  <line x1="680" y1="380" x2="490" y2="380" class="line"/>
  <line x1="400" y1="360" x2="400" y2="380" class="line"/>

  <rect x="310" y="380" width="180" height="40" rx="6" class="node-yellow"/>
  <text x="400" y="405" text-anchor="middle">@After</text>

  <!-- @Around 后置 -->
  <rect x="310" y="440" width="180" height="40" rx="6" class="node-purple"/>
  <text x="400" y="465" text-anchor="middle">@Around 后置</text>

  <!-- Lines -->
  <line x1="400" y1="55" x2="400" y2="80" class="line"/>
  <line x1="400" y1="120" x2="400" y2="145" class="line"/>
  <line x1="400" y1="185" x2="400" y2="210" class="line"/>
  <line x1="400" y1="380" x2="400" y2="440" class="line"/>
</svg>
