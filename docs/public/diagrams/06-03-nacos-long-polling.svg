<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }</style>
  <!-- 参与者 -->
  <rect x="40" y="30" width="120" height="40" rx="6" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="100" y="55" text-anchor="middle" font-weight="bold">Nacos Server</text>
  <rect x="40" y="140" width="120" height="40" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="100" y="165" text-anchor="middle" font-weight="bold">ConfigClient</text>
  <rect x="40" y="260" width="120" height="40" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="100" y="285" text-anchor="middle" font-weight="bold">Spring Context</text>
  <!-- 时间线 -->
  <line x1="200" y1="50" x2="750" y2="50" stroke="#64b5f6" stroke-width="2"/>
  <line x1="200" y1="160" x2="750" y2="160" stroke="#ffb74d" stroke-width="2"/>
  <line x1="200" y1="280" x2="750" y2="280" stroke="#81c784" stroke-width="2"/>
  <!-- 长轮询 -->
  <line x1="250" y1="165" x2="350" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="300" y="105" text-anchor="middle" font-size="11" fill="#666">长轮询（30秒超时）</text>
  <!-- 配置被修改 -->
  <rect x="380" y="30" width="100" height="35" rx="6" fill="#ffcdd2" stroke="#ef5350" stroke-width="1"/>
  <text x="430" y="53" text-anchor="middle" font-size="11" fill="#c62828">配置被修改了！</text>
  <!-- 返回变更列表 -->
  <line x1="480" y1="55" x2="530" y2="155" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="105" text-anchor="middle" font-size="11" fill="#666">返回变更的 Data ID</text>
  <!-- 拉取最新配置 -->
  <line x1="550" y1="155" x2="600" y2="55" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="580" y="105" text-anchor="middle" font-size="11" fill="#666">拉取最新配置</text>
  <!-- 发布 RefreshEvent -->
  <line x1="620" y1="165" x2="650" y2="275" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="220" text-anchor="middle" font-size="11" fill="#666">发布 RefreshEvent</text>
  <!-- 销毁 Bean -->
  <rect x="500" y="310" width="140" height="30" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="570" y="330" text-anchor="middle" font-size="11" fill="#333">销毁 @RefreshScope Bean</text>
  <!-- 重建 Bean -->
  <rect x="660" y="310" width="100" height="30" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1"/>
  <text x="710" y="330" text-anchor="middle" font-size="11" fill="#333">重建 Bean</text>
  <line x1="640" y1="325" x2="660" y2="325" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 注入新值 -->
  <text x="710" y="355" text-anchor="middle" font-size="11" fill="#666">注入新值</text>
</svg>