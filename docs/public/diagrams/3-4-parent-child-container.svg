<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="pc" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#666"/></marker>
  </defs>

  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Spring MVC 父子容器</text>

  <!-- Root container (parent) -->
  <rect x="100" y="50" width="280" height="220" rx="10" fill="#e3f2fd" stroke="#64b5f6" stroke-width="2"/>
  <text x="240" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">Root 容器（爸爸）</text>

  <rect x="130" y="100" width="220" height="32" rx="6" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="240" y="121" text-anchor="middle" fill="#333">Service Beans</text>

  <rect x="130" y="145" width="220" height="32" rx="6" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="240" y="166" text-anchor="middle" fill="#333">Repository Beans</text>

  <rect x="130" y="190" width="220" height="32" rx="6" fill="#fff" stroke="#90caf9" stroke-width="1"/>
  <text x="240" y="211" text-anchor="middle" fill="#333">DataSource Beans</text>

  <!-- Servlet container (child) -->
  <rect x="420" y="50" width="280" height="220" rx="10" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="2"/>
  <text x="560" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#2e7d32">Servlet 容器（儿子）</text>

  <rect x="450" y="100" width="220" height="32" rx="6" fill="#fff" stroke="#a5d6a7" stroke-width="1"/>
  <text x="560" y="121" text-anchor="middle" fill="#333">Controller Beans</text>

  <rect x="450" y="145" width="220" height="32" rx="6" fill="#fff" stroke="#a5d6a7" stroke-width="1"/>
  <text x="560" y="166" text-anchor="middle" fill="#333">ViewResolver Beans</text>

  <rect x="450" y="190" width="220" height="32" rx="6" fill="#fff" stroke="#a5d6a7" stroke-width="1"/>
  <text x="560" y="211" text-anchor="middle" fill="#333">Web 相关 Beans</text>

  <!-- Parent arrow -->
  <line x1="380" y1="160" x2="420" y2="160" stroke="#666" stroke-width="2" marker-end="url(#pc)"/>
  <text x="400" y="150" text-anchor="middle" font-size="12" fill="#666">parent</text>

  <!-- Bottom notes -->
  <rect x="100" y="285" width="280" height="28" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="240" y="304" text-anchor="middle" font-size="12" fill="#333">✅ Controller 可以注入 Service（儿子找爸爸）</text>

  <rect x="420" y="285" width="280" height="28" rx="4" fill="#ffebee" stroke="#ef9a9a" stroke-width="1"/>
  <text x="560" y="304" text-anchor="middle" font-size="12" fill="#c62828">❌ Service 不能注入 Controller（爸爸看不到儿子）</text>
</svg>