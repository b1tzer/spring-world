<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">连接池工作原理</text>

  <!-- Participants -->
  <rect x="80" y="50" rx="6" width="120" height="40" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="140" y="75" text-anchor="middle" font-weight="bold" fill="#333">应用程序</text>

  <rect x="340" y="50" rx="6" width="120" height="40" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="400" y="75" text-anchor="middle" font-weight="bold" fill="#333">连接池</text>

  <rect x="600" y="50" rx="6" width="120" height="40" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="660" y="75" text-anchor="middle" font-weight="bold" fill="#333">数据库</text>

  <line x1="140" y1="90" x2="140" y2="360" stroke="#999" stroke-dasharray="4"/>
  <line x1="400" y1="90" x2="400" y2="360" stroke="#999" stroke-dasharray="4"/>
  <line x1="660" y1="90" x2="660" y2="360" stroke="#999" stroke-dasharray="4"/>

  <!-- Pre-create connections -->
  <rect x="320" y="115" rx="6" width="160" height="55" fill="#fff9c4" stroke="#fdd835" stroke-dasharray="4"/>
  <text x="400" y="135" text-anchor="middle" fill="#333" font-size="12">启动时预创建 N 个连接</text>

  <line x1="404" y1="140" x2="656" y2="140" stroke="#666" marker-end="url(#arrow2)"/>
  <text x="530" y="135" text-anchor="middle" fill="#333" font-size="12">建立连接 1...N</text>

  <!-- Borrow -->
  <line x1="144" y1="200" x2="396" y2="200" stroke="#666" marker-end="url(#arrow2)"/>
  <text x="270" y="195" text-anchor="middle" fill="#333">借连接</text>

  <line x1="396" y1="225" x2="144" y2="225" stroke="#666" stroke-dasharray="4" marker-end="url(#arrow2)"/>
  <text x="270" y="220" text-anchor="middle" fill="#333">返回连接 1（借出）</text>

  <!-- Use -->
  <line x1="144" y1="260" x2="656" y2="260" stroke="#666" marker-end="url(#arrow2)"/>
  <text x="400" y="255" text-anchor="middle" fill="#333">执行 SQL（复用已有连接）</text>

  <!-- Return -->
  <line x1="144" y1="295" x2="396" y2="295" stroke="#666" marker-end="url(#arrow2)"/>
  <text x="270" y="290" text-anchor="middle" fill="#333">还连接</text>

  <!-- Note -->
  <rect x="320" y="315" rx="6" width="160" height="35" fill="#fff9c4" stroke="#fdd835" stroke-dasharray="4"/>
  <text x="400" y="337" text-anchor="middle" fill="#333" font-size="12">连接回到池中，等待下一个请求</text>
</svg>
