<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#666"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#4caf50"/></marker>
    <marker id="ar" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#e53935"/></marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">@Autowired vs @Resource 注入流程</text>

  <!-- @Autowired section -->
  <text x="190" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#1565c0">@Autowired（按类型）</text>

  <rect x="90" y="70" width="200" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="190" y="93" text-anchor="middle" fill="#333">按类型查找 Bean</text>
  <line x1="190" y1="106" x2="190" y2="128" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="110" y="128" width="160" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
  <text x="190" y="151" text-anchor="middle" fill="#333">找到了几个？</text>

  <!-- 1个 -> 直接注入 -->
  <line x1="130" y1="164" x2="70" y2="195" stroke="#4caf50" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="85" y="178" font-size="11" fill="#4caf50">1个</text>
  <rect x="20" y="195" width="110" height="34" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="75" y="217" text-anchor="middle" fill="#333">✅ 直接注入</text>

  <!-- 多个 -> @Qualifier? -->
  <line x1="250" y1="164" x2="310" y2="195" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="295" y="178" font-size="11" fill="#666">多个</text>
  <rect x="240" y="195" width="140" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
  <text x="310" y="218" text-anchor="middle" fill="#333">有 @Qualifier？</text>

  <!-- 有 -> 按限定符 -->
  <line x1="310" y1="231" x2="310" y2="265" stroke="#4caf50" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="318" y="250" font-size="11" fill="#4caf50">有</text>
  <rect x="240" y="265" width="140" height="34" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="310" y="287" text-anchor="middle" fill="#333">按限定符选 ✅</text>

  <!-- 没有 -> @Primary? -->
  <line x1="380" y1="213" x2="420" y2="265" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="405" y="238" font-size="11" fill="#666">没有</text>
  <rect x="360" y="265" width="130" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
  <text x="425" y="288" text-anchor="middle" fill="#333">有 @Primary？</text>

  <!-- 有 -> Primary -->
  <line x1="390" y1="301" x2="330" y2="340" stroke="#4caf50" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="345" y="318" font-size="11" fill="#4caf50">有</text>
  <rect x="260" y="340" width="140" height="34" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="330" y="362" text-anchor="middle" fill="#333">选 Primary ✅</text>

  <!-- 没有 -> 报错 -->
  <line x1="490" y1="301" x2="520" y2="340" stroke="#e53935" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="510" y="318" font-size="11" fill="#e53935">没有</text>
  <rect x="470" y="340" width="110" height="34" rx="6" fill="#ffebee" stroke="#ef9a9a" stroke-width="1"/>
  <text x="525" y="362" text-anchor="middle" fill="#e53935">❌ 报错</text>

  <!-- Divider -->
  <line x1="600" y1="45" x2="600" y2="420" stroke="#ddd" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- @Resource section -->
  <text x="700" y="60" text-anchor="middle" font-size="15" font-weight="bold" fill="#e65100">@Resource（按名字）</text>

  <rect x="610" y="70" width="180" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
  <text x="700" y="93" text-anchor="middle" fill="#333">按名字查找 Bean</text>
  <line x1="700" y1="106" x2="700" y2="128" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="620" y="128" width="160" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
  <text x="700" y="151" text-anchor="middle" fill="#333">名字匹配？</text>

  <!-- 是 -> 直接注入 -->
  <line x1="640" y1="164" x2="620" y2="195" stroke="#4caf50" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="618" y="178" font-size="11" fill="#4caf50">是</text>
  <rect x="560" y="195" width="120" height="34" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="620" y="217" text-anchor="middle" fill="#333">✅ 直接注入</text>

  <!-- 否 -> 退回按类型 -->
  <line x1="760" y1="164" x2="760" y2="195" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="768" y="178" font-size="11" fill="#666">否</text>
  <rect x="690" y="195" width="140" height="34" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="760" y="217" text-anchor="middle" fill="#333">退回按类型找</text>

  <line x1="760" y1="229" x2="760" y2="265" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="700" y="265" width="120" height="34" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="760" y="287" text-anchor="middle" fill="#333">类型结果 ✅</text>

  <!-- Summary table -->
  <rect x="100" y="410" width="600" height="60" rx="6" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="400" y="435" text-anchor="middle" font-size="13" fill="#555">@Autowired：类型 → @Qualifier → @Primary → 报错</text>
  <text x="400" y="455" text-anchor="middle" font-size="13" fill="#555">@Resource：名字 → 退回按类型</text>
</svg>