<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">多数据源架构</text>

  <!-- Application subgraph -->
  <rect x="40" y="45" rx="6" width="320" height="180" fill="none" stroke="#90caf9" stroke-dasharray="4"/>
  <text x="60" y="65" font-size="12" fill="#666">应用</text>

  <rect x="80" y="80" rx="6" width="120" height="40" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="140" y="105" text-anchor="middle" font-weight="bold" fill="#333">OrderService</text>

  <rect x="60" y="150" rx="6" width="140" height="35" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="130" y="172" text-anchor="middle" fill="#333">businessJdbcTemplate</text>

  <rect x="220" y="150" rx="6" width="140" height="35" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="290" y="172" text-anchor="middle" fill="#333">warehouseJdbcTemplate</text>

  <!-- DataSource config subgraph -->
  <rect x="40" y="250" rx="6" width="320" height="60" fill="none" stroke="#ffcc80" stroke-dasharray="4"/>
  <text x="60" y="270" font-size="12" fill="#666">数据源配置</text>

  <rect x="60" y="280" rx="6" width="130" height="30" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="125" y="300" text-anchor="middle" fill="#333">businessDataSource</text>

  <rect x="210" y="280" rx="6" width="140" height="30" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="280" y="300" text-anchor="middle" fill="#333">warehouseDataSource</text>

  <!-- Database subgraph -->
  <rect x="420" y="250" rx="6" width="360" height="60" fill="none" stroke="#a5d6a7" stroke-dasharray="4"/>
  <text x="440" y="270" font-size="12" fill="#666">数据库</text>

  <rect x="440" y="280" rx="6" width="140" height="30" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="510" y="300" text-anchor="middle" fill="#333">business_db</text>

  <rect x="620" y="280" rx="6" width="140" height="30" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="690" y="300" text-anchor="middle" fill="#333">warehouse_db</text>

  <!-- Connections: Service → JdbcTemplates -->
  <line x1="110" y1="120" x2="100" y2="148" stroke="#666" marker-end="url(#arrow3)"/>
  <line x1="170" y1="120" x2="320" y2="148" stroke="#666" marker-end="url(#arrow3)"/>

  <!-- JdbcTemplates → DataSources -->
  <line x1="130" y1="185" x2="125" y2="278" stroke="#666" marker-end="url(#arrow3)"/>
  <line x1="290" y1="185" x2="280" y2="278" stroke="#666" marker-end="url(#arrow3)"/>

  <!-- DataSources → Databases -->
  <line x1="190" y1="295" x2="438" y2="295" stroke="#666" marker-end="url(#arrow3)"/>
  <line x1="350" y1="295" x2="618" y2="295" stroke="#666" marker-end="url(#arrow3)"/>

  <!-- Legend note -->
  <rect x="420" y="80" rx="6" width="350" height="120" fill="#f5f5f5" stroke="#ddd"/>
  <text x="440" y="105" font-size="13" font-weight="bold" fill="#333">要点</text>
  <text x="440" y="128" fill="#555" font-size="12">• 排除 DataSourceAutoConfiguration</text>
  <text x="440" y="148" fill="#555" font-size="12">• 通过 @Qualifier 注入对应 JdbcTemplate</text>
  <text x="440" y="168" fill="#555" font-size="12">• 每个数据源独立连接池配置</text>
  <text x="440" y="188" fill="#555" font-size="12">• 跨数据源事务需手动管理</text>
</svg>
