<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <!-- Top path: with starter -->
  <text x="400" y="25" text-anchor="middle" fill="#333" font-size="15" font-weight="bold">引入 starter-web 的情况</text>
  <rect x="20" y="40" width="220" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="130" y="68" text-anchor="middle" fill="#333" font-size="13">引入 spring-boot-starter-web</text>
  <line x1="240" y1="62" x2="270" y2="62" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="40" width="230" height="45" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="385" y="68" text-anchor="middle" fill="#333" font-size="13">classpath 有了 DispatcherServlet</text>
  <line x1="500" y1="62" x2="530" y2="62" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="530" y="40" width="250" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="655" y="68" text-anchor="middle" fill="#333" font-size="13">@ConditionalOnClass 满足</text>
  <!-- arrow down -->
  <line x1="655" y1="85" x2="655" y2="115" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="430" y="115" width="350" height="45" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="605" y="143" text-anchor="middle" fill="#333" font-size="13">WebMvcAutoConfiguration 生效</text>
  <line x1="605" y1="160" x2="605" y2="190" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="190" width="400" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="580" y="218" text-anchor="middle" fill="#333" font-size="13">自动注册 DispatcherServlet、ViewResolver 等</text>

  <!-- Divider -->
  <line x1="40" y1="260" x2="760" y2="260" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Bottom path: without starter -->
  <text x="400" y="285" text-anchor="middle" fill="#333" font-size="15" font-weight="bold">未引入 starter-web 的情况</text>
  <rect x="20" y="300" width="200" height="45" rx="6" fill="#ffcdd2" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="120" y="328" text-anchor="middle" fill="#333" font-size="13">没引入 starter-web</text>
  <line x1="220" y1="322" x2="250" y2="322" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="300" width="220" height="45" rx="6" fill="#ffcdd2" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="360" y="328" text-anchor="middle" fill="#333" font-size="13">classpath 无 DispatcherServlet</text>
  <line x1="470" y1="322" x2="500" y2="322" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="300" width="280" height="45" rx="6" fill="#ffcdd2" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="640" y="328" text-anchor="middle" fill="#333" font-size="13">@ConditionalOnClass 不满足</text>
  <line x1="640" y1="345" x2="640" y2="365" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="365" width="280" height="30" rx="6" fill="#ffcdd2" stroke="#ef9a9a" stroke-width="1.5"/>
  <text x="640" y="385" text-anchor="middle" fill="#333" font-size="13">配置类被跳过</text>
</svg>
