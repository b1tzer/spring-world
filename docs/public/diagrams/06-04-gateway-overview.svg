<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }</style>
  <!-- 前端 / App -->
  <rect x="30" y="70" width="130" height="60" rx="6" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="95" y="105" text-anchor="middle">前端 / App</text>
  <!-- API 网关 -->
  <rect x="260" y="70" width="130" height="60" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="325" y="105" text-anchor="middle">API 网关</text>
  <!-- 用户服务 -->
  <rect x="500" y="30" width="130" height="45" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="565" y="58" text-anchor="middle">用户服务</text>
  <!-- 订单服务 -->
  <rect x="500" y="90" width="130" height="45" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="565" y="118" text-anchor="middle">订单服务</text>
  <!-- 商品服务 -->
  <rect x="500" y="150" width="130" height="45" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="565" y="178" text-anchor="middle">商品服务</text>
  <!-- 箭头 -->
  <line x1="160" y1="100" x2="260" y2="100" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="85" x2="500" y2="52" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="100" x2="500" y2="112" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="115" x2="500" y2="172" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 网关自环标注 -->
  <text x="260" y="55" font-size="11" fill="#666">鉴权</text>
  <text x="325" y="55" font-size="11" fill="#666">限流</text>
  <text x="390" y="55" font-size="11" fill="#666">日志</text>
</svg>