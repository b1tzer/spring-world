<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }</style>
  <!-- Nacos 配置中心 -->
  <rect x="300" y="20" width="200" height="50" rx="6" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="400" y="50" text-anchor="middle">Nacos 配置中心</text>
  <!-- 运维人员 -->
  <rect x="30" y="20" width="120" height="45" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="90" y="48" text-anchor="middle">运维人员</text>
  <!-- 服务实例 1 -->
  <rect x="200" y="160" width="130" height="50" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="265" y="190" text-anchor="middle">服务实例 1</text>
  <!-- 服务实例 2 -->
  <rect x="380" y="160" width="130" height="50" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="445" y="190" text-anchor="middle">服务实例 2</text>
  <!-- 服务实例 3 -->
  <rect x="560" y="160" width="130" height="50" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="625" y="190" text-anchor="middle">服务实例 3</text>
  <!-- 箭头 -->
  <line x1="150" y1="45" x2="300" y2="45" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="38" text-anchor="middle" font-size="11" fill="#666">修改配置</text>
  <line x1="340" y1="70" x2="280" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="290" y="120" text-anchor="middle" font-size="11" fill="#666">推送变更</text>
  <line x1="400" y1="70" x2="445" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="120" text-anchor="middle" font-size="11" fill="#666">推送变更</text>
  <line x1="460" y1="70" x2="610" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="560" y="120" text-anchor="middle" font-size="11" fill="#666">推送变更</text>
</svg>