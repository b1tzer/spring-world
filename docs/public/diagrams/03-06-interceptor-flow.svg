<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow8" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">拦截器执行时序</text>

  <!-- Participants -->
  <rect x="20" y="50" width="70" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="55" y="73" text-anchor="middle" fill="#333">客户端</text>
  <rect x="130" y="50" width="120" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="190" y="73" text-anchor="middle" fill="#333">DispatcherServlet</text>
  <rect x="300" y="50" width="100" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="350" y="73" text-anchor="middle" fill="#333">Interceptor</text>
  <text x="350" y="85" text-anchor="middle" fill="#333" font-size="11">preHandle</text>
  <rect x="440" y="50" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="490" y="73" text-anchor="middle" fill="#333">Handler</text>
  <text x="490" y="85" text-anchor="middle" fill="#333" font-size="11">(Controller)</text>
  <rect x="580" y="50" width="100" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="630" y="73" text-anchor="middle" fill="#333">Interceptor</text>
  <text x="630" y="85" text-anchor="middle" fill="#333" font-size="11">postHandle</text>
  <rect x="720" y="50" width="70" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="755" y="73" text-anchor="middle" fill="#333">ViewResolver</text>

  <!-- Lifelines -->
  <line x1="55" y1="86" x2="55" y2="400" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="190" y1="86" x2="190" y2="400" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="350" y1="86" x2="350" y2="400" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="490" y1="86" x2="490" y2="400" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="630" y1="86" x2="630" y2="400" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="755" y1="86" x2="755" y2="400" stroke="#999" stroke-dasharray="4,4"/>

  <!-- 1: Client -> DS -->
  <line x1="55" y1="120" x2="185" y2="120" stroke="#666" marker-end="url(#arrow8)"/>
  <text x="120" y="115" text-anchor="middle" fill="#333">HTTP Request</text>

  <!-- 2: DS -> preHandle -->
  <line x1="190" y1="155" x2="345" y2="155" stroke="#666" marker-end="url(#arrow8)"/>
  <text x="267" y="150" text-anchor="middle" fill="#333">preHandle()</text>

  <!-- alt: 返回 false -->
  <rect x="280" y="170" width="160" height="50" rx="4" fill="none" stroke="#999" stroke-dasharray="4,4"/>
  <text x="285" y="185" fill="#999" font-size="12">alt 返回 false</text>
  <line x1="345" y1="200" x2="60" y2="200" stroke="#666" stroke-dasharray="4,4" marker-end="url(#arrow8)"/>
  <text x="200" y="195" text-anchor="middle" fill="#333" font-size="12">直接返回（401/403）</text>

  <!-- alt: 返回 true -->
  <rect x="280" y="230" width="380" height="130" rx="4" fill="none" stroke="#999" stroke-dasharray="4,4"/>
  <text x="285" y="245" fill="#999" font-size="12">alt 返回 true</text>

  <!-- 3: preHandle -> Handler -->
  <line x1="350" y1="260" x2="485" y2="260" stroke="#666" marker-end="url(#arrow8)"/>
  <text x="417" y="255" text-anchor="middle" fill="#333">执行 Handler</text>

  <!-- 4: Handler -> postHandle -->
  <line x1="490" y1="300" x2="625" y2="300" stroke="#666" marker-end="url(#arrow8)"/>
  <text x="557" y="295" text-anchor="middle" fill="#333">postHandle()</text>

  <!-- 5: postHandle -> VR -->
  <line x1="630" y1="330" x2="750" y2="330" stroke="#666" marker-end="url(#arrow8)"/>
  <text x="690" y="325" text-anchor="middle" fill="#333">渲染视图</text>

  <!-- afterCompletion -->
  <rect x="280" y="370" width="380" height="30" rx="4" fill="none" stroke="#999" stroke-dasharray="4,4"/>
  <!-- 6: VR -> afterCompletion -->
  <line x1="755" y1="385" x2="355" y2="385" stroke="#666" stroke-dasharray="4,4" marker-end="url(#arrow8)"/>
  <text x="550" y="380" text-anchor="middle" fill="#333" font-size="12">afterCompletion()</text>
  <text x="285" y="396" fill="#999" font-size="11">无论是否异常都执行</text>
</svg>