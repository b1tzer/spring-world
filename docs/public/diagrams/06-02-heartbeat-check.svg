<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }</style>
  <!-- 参与者标签 -->
  <rect x="40" y="40" width="120" height="40" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="100" y="65" text-anchor="middle" font-weight="bold">服务实例</text>
  <rect x="40" y="160" width="120" height="40" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="100" y="185" text-anchor="middle" font-weight="bold">注册中心</text>
  <!-- 时间线 -->
  <line x1="200" y1="60" x2="750" y2="60" stroke="#81c784" stroke-width="2"/>
  <line x1="200" y1="180" x2="750" y2="180" stroke="#ffb74d" stroke-width="2"/>
  <!-- 心跳1 -->
  <line x1="250" y1="65" x2="300" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="275" y="125" text-anchor="middle" font-size="11" fill="#666">心跳</text>
  <!-- 心跳2 -->
  <line x1="370" y1="65" x2="420" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="395" y="125" text-anchor="middle" font-size="11" fill="#666">心跳</text>
  <!-- 心跳3 -->
  <line x1="490" y1="65" x2="540" y2="175" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="515" y="125" text-anchor="middle" font-size="11" fill="#666">心跳</text>
  <!-- 实例崩溃 -->
  <rect x="580" y="40" width="100" height="35" rx="6" fill="#ffcdd2" stroke="#ef5350" stroke-width="1.5"/>
  <text x="630" y="63" text-anchor="middle" font-size="12" fill="#c62828">实例崩溃！</text>
  <!-- 15秒没收到心跳 -->
  <rect x="350" y="230" width="180" height="35" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="440" y="253" text-anchor="middle" font-size="12" fill="#333">15秒没收到心跳</text>
  <!-- 标记不健康 -->
  <rect x="350" y="280" width="180" height="35" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1"/>
  <text x="440" y="303" text-anchor="middle" font-size="12" fill="#333">标记为不健康</text>
  <!-- 30秒后剔除 -->
  <rect x="570" y="280" width="160" height="35" rx="6" fill="#ffcdd2" stroke="#ef5350" stroke-width="1"/>
  <text x="650" y="303" text-anchor="middle" font-size="12" fill="#c62828">30秒后剔除</text>
  <!-- 箭头 -->
  <line x1="440" y1="265" x2="440" y2="280" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="530" y1="297" x2="570" y2="297" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>