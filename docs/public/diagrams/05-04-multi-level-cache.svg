<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow9" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">多级缓存架构</text>

  <!-- Request -->
  <rect x="30" y="100" rx="6" width="80" height="40" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="70" y="125" text-anchor="middle" fill="#333">请求</text>

  <line x1="110" y1="120" x2="160" y2="120" stroke="#666" marker-end="url(#arrow9)"/>

  <!-- Local cache -->
  <polygon points="240,80 330,120 240,160 150,120" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="240" y="112" text-anchor="middle" fill="#333" font-size="12">本地缓存</text>
  <text x="240" y="128" text-anchor="middle" fill="#333" font-size="12">Caffeine</text>

  <!-- Hit -->
  <line x1="330" y1="95" x2="400" y2="75" stroke="#666" marker-end="url(#arrow9)"/>
  <text x="365" y="80" fill="#666" font-size="11">命中</text>

  <rect x="405" y="60" rx="6" width="70" height="35" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="440" y="82" text-anchor="middle" fill="#333" font-size="12">返回</text>

  <!-- Miss → Redis -->
  <line x1="330" y1="130" x2="420" y2="130" stroke="#666" marker-end="url(#arrow9)"/>
  <text x="375" y="145" fill="#666" font-size="11">未命中</text>

  <!-- Redis -->
  <polygon points="500,110 590,130 500,170 410,130" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="500" y="135" text-anchor="middle" fill="#333" font-size="12">Redis</text>

  <!-- Redis hit -->
  <line x1="590" y1="115" x2="640" y2="85" stroke="#666" marker-end="url(#arrow9)"/>
  <text x="615" y="95" fill="#666" font-size="11">命中</text>

  <rect x="645" y="70" rx="6" width="130" height="35" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="710" y="85" text-anchor="middle" fill="#333" font-size="11">返回并写入</text>
  <text x="710" y="100" text-anchor="middle" fill="#333" font-size="11">本地缓存</text>

  <!-- Redis miss → DB -->
  <line x1="590" y1="145" x2="650" y2="160" stroke="#666" marker-end="url(#arrow9)"/>
  <text x="620" y="165" fill="#666" font-size="11">未命中</text>

  <rect x="655" y="145" rx="6" width="80" height="35" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="695" y="167" text-anchor="middle" fill="#333" font-size="12">查数据库</text>

  <line x1="695" y1="180" x2="695" y2="210" stroke="#666" marker-end="url(#arrow9)"/>

  <rect x="620" y="215" rx="6" width="150" height="30" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="695" y="235" text-anchor="middle" fill="#333" font-size="11">写入 Redis + 本地缓存</text>
</svg>
