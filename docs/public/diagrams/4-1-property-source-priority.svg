<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="ps" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#666"/></marker>
  </defs>

  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">PropertySource 配置优先级</text>
  <text x="400" y="48" text-anchor="middle" font-size="13" fill="#666">越靠前优先级越高，第一个匹配的值生效</text>

  <!-- Priority list as flowing boxes -->
  <rect x="200" y="65" width="400" height="38" rx="6" fill="#e53935" opacity="0.15" stroke="#e53935" stroke-width="1.5"/>
  <text x="220" y="89" font-size="13" fill="#c62828">🔴 最高</text>
  <text x="400" y="89" text-anchor="middle" font-weight="bold" fill="#333">命令行参数 --server.port=9090</text>

  <line x1="400" y1="103" x2="400" y2="115" stroke="#666" stroke-width="1.5" marker-end="url(#ps)"/>

  <rect x="200" y="115" width="400" height="38" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
  <text x="400" y="139" text-anchor="middle" fill="#333">JVM 系统属性 -Dapp.port=8080</text>

  <line x1="400" y1="153" x2="400" y2="165" stroke="#666" stroke-width="1.5" marker-end="url(#ps)"/>

  <rect x="200" y="165" width="400" height="38" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
  <text x="400" y="189" text-anchor="middle" fill="#333">系统环境变量 DB_HOST=localhost</text>

  <line x1="400" y1="203" x2="400" y2="215" stroke="#666" stroke-width="1.5" marker-end="url(#ps)"/>

  <rect x="200" y="215" width="400" height="38" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="400" y="239" text-anchor="middle" fill="#333">application-{profile}.yml</text>

  <line x1="400" y1="253" x2="400" y2="265" stroke="#666" stroke-width="1.5" marker-end="url(#ps)"/>

  <rect x="200" y="265" width="400" height="38" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="400" y="289" text-anchor="middle" fill="#333">application.yml</text>

  <line x1="400" y1="303" x2="400" y2="315" stroke="#666" stroke-width="1.5" marker-end="url(#ps)"/>

  <rect x="200" y="315" width="400" height="38" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="400" y="339" text-anchor="middle" fill="#333">@PropertySource 注解</text>

  <line x1="400" y1="353" x2="400" y2="362" stroke="#666" stroke-width="1.5" marker-end="url(#ps)"/>

  <rect x="250" y="362" width="300" height="14" rx="4" fill="#4caf50" opacity="0.2" stroke="#4caf50" stroke-width="1"/>
  <text x="400" y="373" text-anchor="middle" font-size="11" fill="#2e7d32">🟢 最低：代码默认值</text>
</svg>