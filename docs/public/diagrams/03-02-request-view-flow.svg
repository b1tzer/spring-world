<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">请求处理与视图解析时序</text>

  <!-- Participants -->
  <rect x="30" y="50" width="110" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="85" y="73" text-anchor="middle" fill="#333">DispatcherServlet</text>
  <rect x="190" y="50" width="110" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="245" y="73" text-anchor="middle" fill="#333">HandlerAdapter</text>
  <rect x="350" y="50" width="90" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="395" y="73" text-anchor="middle" fill="#333">Controller</text>
  <rect x="490" y="50" width="100" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="540" y="73" text-anchor="middle" fill="#333">ViewResolver</text>
  <rect x="640" y="50" width="70" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="675" y="73" text-anchor="middle" fill="#333">View</text>
  <rect x="740" y="50" width="50" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="765" y="73" text-anchor="middle" fill="#333">客户端</text>

  <!-- Lifelines -->
  <line x1="85" y1="86" x2="85" y2="450" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="245" y1="86" x2="245" y2="450" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="395" y1="86" x2="395" y2="450" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="540" y1="86" x2="540" y2="450" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="675" y1="86" x2="675" y2="450" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="765" y1="86" x2="765" y2="450" stroke="#999" stroke-dasharray="4,4"/>

  <!-- DA -> HA -->
  <line x1="85" y1="120" x2="240" y2="120" stroke="#666" marker-end="url(#arrow2)"/>
  <text x="162" y="115" text-anchor="middle" fill="#333">handle(request, response)</text>

  <!-- HA -> Controller -->
  <line x1="245" y1="160" x2="390" y2="160" stroke="#666" marker-end="url(#arrow2)"/>
  <text x="317" y="155" text-anchor="middle" fill="#333">调用 Controller 方法</text>

  <!-- Controller -> HA (return) -->
  <line x1="390" y1="200" x2="250" y2="200" stroke="#666" stroke-dasharray="4,4" marker-end="url(#arrow2)"/>
  <text x="320" y="195" text-anchor="middle" fill="#333">返回 ModelAndView</text>

  <!-- HA -> DA (return) -->
  <line x1="240" y1="240" x2="90" y2="240" stroke="#666" stroke-dasharray="4,4" marker-end="url(#arrow2)"/>
  <text x="165" y="235" text-anchor="middle" fill="#333">返回 ModelAndView</text>

  <!-- DA -> ViewResolver -->
  <line x1="85" y1="280" x2="535" y2="280" stroke="#666" marker-end="url(#arrow2)"/>
  <text x="310" y="275" text-anchor="middle" fill="#333">resolveViewName("user/list")</text>

  <!-- ViewResolver -> DA (return) -->
  <line x1="535" y1="320" x2="90" y2="320" stroke="#666" stroke-dasharray="4,4" marker-end="url(#arrow2)"/>
  <text x="312" y="315" text-anchor="middle" fill="#333">返回 View 对象</text>

  <!-- DA -> View -->
  <line x1="85" y1="360" x2="670" y2="360" stroke="#666" marker-end="url(#arrow2)"/>
  <text x="377" y="355" text-anchor="middle" fill="#333">render(model, request, response)</text>

  <!-- View -> Client -->
  <line x1="675" y1="400" x2="760" y2="400" stroke="#666" marker-end="url(#arrow2)"/>
  <text x="717" y="395" text-anchor="middle" fill="#333">HTML 页面</text>
</svg>