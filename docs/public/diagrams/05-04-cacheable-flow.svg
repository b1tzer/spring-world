<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">@Cacheable 缓存流程</text>

  <!-- Start -->
  <rect x="40" y="80" rx="6" width="140" height="40" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="110" y="105" text-anchor="middle" fill="#333">调用 getProductById</text>

  <line x1="180" y1="100" x2="230" y2="100" stroke="#666" marker-end="url(#arrow7)"/>

  <!-- Decision -->
  <polygon points="320,60 420,100 320,140 220,100" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="320" y="95" text-anchor="middle" fill="#333" font-size="12">缓存中</text>
  <text x="320" y="110" text-anchor="middle" fill="#333" font-size="12">有数据?</text>

  <!-- Hit path -->
  <line x1="420" y1="80" x2="500" y2="60" stroke="#666" marker-end="url(#arrow7)"/>
  <text x="460" y="65" fill="#666" font-size="11">命中</text>

  <rect x="505" y="45" rx="6" width="160" height="35" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="585" y="67" text-anchor="middle" fill="#333" font-size="12">直接返回缓存数据</text>

  <!-- Miss path -->
  <line x1="420" y1="120" x2="500" y2="140" stroke="#666" marker-end="url(#arrow7)"/>
  <text x="460" y="145" fill="#666" font-size="11">未命中</text>

  <rect x="505" y="125" rx="6" width="160" height="35" fill="#ffcdd2" stroke="#ef9a9a"/>
  <text x="585" y="147" text-anchor="middle" fill="#333" font-size="12">执行方法体（查数据库）</text>

  <line x1="665" y1="142" x2="710" y2="142" stroke="#666" marker-end="url(#arrow7)"/>

  <rect x="715" y="125" rx="6" width="70" height="35" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="750" y="147" text-anchor="middle" fill="#333" font-size="11">返回结果</text>

  <!-- Write back -->
  <line x1="585" y1="160" x2="585" y2="200" stroke="#666" marker-end="url(#arrow7)"/>

  <rect x="505" y="205" rx="6" width="160" height="35" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="585" y="227" text-anchor="middle" fill="#333" font-size="12">将结果放入缓存</text>

  <line x1="585" y1="240" x2="585" y2="260" stroke="#666" marker-end="url(#arrow7)"/>

  <rect x="525" y="262" rx="6" width="120" height="30" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="585" y="282" text-anchor="middle" fill="#333" font-size="12">返回结果</text>
</svg>
