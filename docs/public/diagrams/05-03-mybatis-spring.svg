<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow6" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Spring 整合 MyBatis 架构</text>

  <!-- Config subgraph -->
  <rect x="40" y="50" rx="6" width="200" height="120" fill="none" stroke="#ffcc80" stroke-dasharray="4"/>
  <text x="60" y="70" font-size="12" fill="#666">配置</text>

  <rect x="60" y="80" rx="6" width="70" height="35" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="95" y="102" text-anchor="middle" fill="#333" font-size="12">@MapperScan</text>

  <rect x="150" y="80" rx="6" width="70" height="35" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="185" y="102" text-anchor="middle" fill="#333" font-size="12">DataSource</text>

  <!-- Spring container subgraph -->
  <rect x="300" y="50" rx="6" width="480" height="300" fill="none" stroke="#90caf9" stroke-dasharray="4"/>
  <text x="320" y="70" font-size="12" fill="#666">Spring 容器</text>

  <rect x="340" y="85" rx="6" width="150" height="40" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="415" y="110" text-anchor="middle" fill="#333">SqlSessionFactory</text>

  <rect x="560" y="85" rx="6" width="170" height="40" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="645" y="110" text-anchor="middle" fill="#333">SqlSessionTemplate</text>

  <rect x="340" y="180" rx="6" width="150" height="40" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="415" y="205" text-anchor="middle" fill="#333">UserMapper 代理</text>

  <rect x="560" y="180" rx="6" width="170" height="40" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="645" y="205" text-anchor="middle" fill="#333">OrderMapper 代理</text>

  <!-- Connections -->
  <line x1="95" y1="115" x2="95" y2="150" stroke="#666" marker-end="url(#arrow6)"/>
  <line x1="95" y1="150" x2="380" y2="150" stroke="#666" stroke-dasharray="2"/>
  <text x="230" y="145" fill="#666" font-size="11">扫描接口</text>

  <line x1="185" y1="115" x2="185" y2="145" stroke="#666"/>
  <line x1="185" y1="145" x2="340" y2="105" stroke="#666" marker-end="url(#arrow6)"/>

  <line x1="490" y1="105" x2="558" y2="105" stroke="#666" marker-end="url(#arrow6)"/>

  <!-- Mapper → Template -->
  <line x1="490" y1="200" x2="558" y2="120" stroke="#666" stroke-dasharray="4" marker-end="url(#arrow6)"/>
  <line x1="645" y1="180" x2="645" y2="127" stroke="#666" stroke-dasharray="4" marker-end="url(#arrow6)"/>

  <text x="520" y="155" fill="#666" font-size="11">执行</text>
  <text x="660" y="160" fill="#666" font-size="11">执行</text>

  <!-- Template → Factory -->
  <line x1="645" y1="125" x2="492" y2="108" stroke="#666" stroke-dasharray="4" marker-end="url(#arrow6)"/>
  <text x="570" y="100" fill="#666" font-size="11">委托</text>

  <!-- Bottom note -->
  <rect x="340" y="270" rx="6" width="380" height="60" fill="#f5f5f5" stroke="#ddd"/>
  <text x="360" y="290" font-size="12" fill="#333" font-weight="bold">@MapperScan 核心作用</text>
  <text x="360" y="310" fill="#555" font-size="11">扫描 Mapper 接口 → 创建 MapperProxy 代理 → 注册到容器</text>
  <text x="360" y="325" fill="#555" font-size="11">调用方法时自动获取 SqlSession、执行 SQL、关闭 Session</text>
</svg>
