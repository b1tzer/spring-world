<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }
    .title { font-size: 13px; font-weight: bold; fill: #555; }
    .node-blue { fill: #e3f2fd; stroke: #90caf9; stroke-width: 1.5; }
    .node-green { fill: #e8f5e9; stroke: #a5d6a7; stroke-width: 1.5; }
    .line { stroke: #666; stroke-width: 1.2; stroke-dasharray: 6 3; }
  </style>

  <!-- 纵向业务模块 box -->
  <rect x="30" y="30" width="280" height="260" rx="8" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="170" y="55" text-anchor="middle" class="title">纵向业务模块</text>

  <rect x="80" y="75" width="180" height="45" rx="6" class="node-blue"/>
  <text x="170" y="102" text-anchor="middle">订单服务</text>

  <rect x="80" y="140" width="180" height="45" rx="6" class="node-blue"/>
  <text x="170" y="167" text-anchor="middle">用户服务</text>

  <rect x="80" y="205" width="180" height="45" rx="6" class="node-blue"/>
  <text x="170" y="232" text-anchor="middle">支付服务</text>

  <!-- 横切关注点 box -->
  <rect x="490" y="30" width="280" height="260" rx="8" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="4 2"/>
  <text x="630" y="55" text-anchor="middle" class="title">横切关注点</text>

  <rect x="540" y="75" width="180" height="45" rx="6" class="node-green"/>
  <text x="630" y="102" text-anchor="middle">日志</text>

  <rect x="540" y="140" width="180" height="45" rx="6" class="node-green"/>
  <text x="630" y="167" text-anchor="middle">权限</text>

  <rect x="540" y="205" width="180" height="45" rx="6" class="node-green"/>
  <text x="630" y="232" text-anchor="middle">事务</text>

  <!-- 连线：日志 → 订单/用户/支付 -->
  <line x1="540" y1="97" x2="260" y2="97" class="line"/>
  <line x1="540" y1="97" x2="260" y2="162" class="line"/>
  <line x1="540" y1="97" x2="260" y2="227" class="line"/>

  <!-- 连线：权限 → 订单/用户/支付 -->
  <line x1="540" y1="162" x2="260" y2="97" class="line"/>
  <line x1="540" y1="162" x2="260" y2="162" class="line"/>
  <line x1="540" y1="162" x2="260" y2="227" class="line"/>

  <!-- 连线：事务 → 订单/用户/支付 -->
  <line x1="540" y1="227" x2="260" y2="97" class="line"/>
  <line x1="540" y1="227" x2="260" y2="162" class="line"/>
  <line x1="540" y1="227" x2="260" y2="227" class="line"/>
</svg>
