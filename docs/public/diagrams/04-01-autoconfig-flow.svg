<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <!-- A: @SpringBootApplication -->
  <rect x="250" y="20" width="300" height="45" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="400" y="48" text-anchor="middle" fill="#333" font-size="14">@SpringBootApplication</text>
  <!-- arrow A->B -->
  <line x1="400" y1="65" x2="400" y2="95" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- B: @EnableAutoConfiguration -->
  <rect x="250" y="95" width="300" height="45" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="400" y="123" text-anchor="middle" fill="#333" font-size="14">@EnableAutoConfiguration</text>
  <!-- arrow B->C -->
  <line x1="400" y1="140" x2="400" y2="170" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- C: @Import(AutoConfigurationImportSelector) -->
  <rect x="180" y="170" width="440" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="400" y="198" text-anchor="middle" fill="#333" font-size="14">@Import(AutoConfigurationImportSelector)</text>
  <!-- arrow C->D -->
  <line x1="400" y1="215" x2="400" y2="245" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- D: selectImports() -->
  <rect x="280" y="245" width="240" height="45" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="400" y="273" text-anchor="middle" fill="#333" font-size="14">selectImports()</text>
  <!-- arrow D->E -->
  <line x1="400" y1="290" x2="400" y2="320" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- E: 扫描所有 jar 包的配置清单 -->
  <rect x="220" y="320" width="360" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="400" y="348" text-anchor="middle" fill="#333" font-size="14">扫描所有 jar 包的配置清单</text>
  <!-- arrow E->F -->
  <line x1="400" y1="365" x2="400" y2="395" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- F: 收集上百个自动配置类 -->
  <rect x="230" y="395" width="340" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="400" y="423" text-anchor="middle" fill="#333" font-size="14">收集上百个自动配置类</text>
  <!-- arrow F->G -->
  <line x1="400" y1="440" x2="400" y2="470" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- G: 条件过滤 -->
  <rect x="300" y="470" width="200" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="400" y="498" text-anchor="middle" fill="#333" font-size="14">条件过滤</text>
  <!-- arrow G->H -->
  <line x1="400" y1="515" x2="400" y2="545" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- H: 注册到容器 -->
  <rect x="300" y="545" width="200" height="45" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="400" y="573" text-anchor="middle" fill="#333" font-size="14">注册到容器</text>
</svg>
