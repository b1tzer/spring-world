<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }</style>
  <!-- Feign 调用 -->
  <rect x="30" y="30" width="140" height="50" rx="6" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="100" y="60" text-anchor="middle">Feign 调用</text>
  <!-- 失败 -->
  <rect x="30" y="120" width="80" height="40" rx="6" fill="#ffcdd2" stroke="#ef5350" stroke-width="1"/>
  <text x="70" y="145" text-anchor="middle" font-size="12">失败</text>
  <!-- 是幂等操作吗？ -->
  <polygon points="250,140 350,180 250,220 150,180" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="250" y="177" text-anchor="middle" font-size="12">是幂等操作？</text>
  <!-- 等待后重试 -->
  <rect x="400" y="120" width="130" height="45" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="465" y="148" text-anchor="middle" font-size="12">等待后重试</text>
  <!-- 返回结果 -->
  <rect x="580" y="60" width="120" height="45" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="640" y="88" text-anchor="middle">返回结果</text>
  <!-- 达到重试上限？ -->
  <polygon points="570,210 670,250 570,290 470,250" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="570" y="247" text-anchor="middle" font-size="12">达到上限？</text>
  <!-- 抛异常 -->
  <rect x="680" y="230" width="100" height="45" rx="6" fill="#ffcdd2" stroke="#ef5350" stroke-width="1.5"/>
  <text x="730" y="248" text-anchor="middle" font-size="11">抛异常</text>
  <text x="730" y="263" text-anchor="middle" font-size="11">交给熔断器</text>
  <!-- 否 → 抛异常 -->
  <rect x="300" y="250" width="80" height="35" rx="6" fill="#ffcdd2" stroke="#ef5350" stroke-width="1"/>
  <text x="340" y="273" text-anchor="middle" font-size="12">否</text>
  <!-- 箭头 -->
  <line x1="100" y1="80" x2="70" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="110" y1="140" x2="150" y2="165" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="140" y="148" font-size="11" fill="#666">失败</text>
  <line x1="350" y1="165" x2="400" y2="145" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="375" y="148" font-size="11" fill="#666">是</text>
  <line x1="465" y1="120" x2="580" y2="82" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="530" y="95" font-size="11" fill="#666">成功</text>
  <line x1="530" y1="148" x2="560" y2="215" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="535" y="185" font-size="11" fill="#666">仍然失败</text>
  <line x1="640" y1="255" x2="680" y2="255" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="660" y="248" font-size="11" fill="#666">是</text>
  <line x1="470" y1="250" x2="680" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="260" font-size="11" fill="#666">否</text>
  <line x1="250" y1="220" x2="300" y2="250" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>