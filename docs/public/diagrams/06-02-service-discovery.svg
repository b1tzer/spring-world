<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }</style>
  <!-- 订单服务 -->
  <rect x="30" y="70" width="130" height="60" rx="6" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="95" y="105" text-anchor="middle">订单服务</text>
  <!-- 注册中心 -->
  <rect x="280" y="70" width="130" height="60" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="345" y="105" text-anchor="middle">注册中心</text>
  <!-- 用户服务 :8081 -->
  <rect x="530" y="40" width="140" height="50" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="600" y="70" text-anchor="middle">用户服务 :8081</text>
  <!-- 用户服务 :8082 -->
  <rect x="530" y="120" width="140" height="50" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="600" y="150" text-anchor="middle">用户服务 :8082</text>
  <!-- 箭头 -->
  <line x1="160" y1="85" x2="280" y2="85" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="78" text-anchor="middle" font-size="11" fill="#666">1. 查询地址</text>
  <line x1="280" y1="115" x2="160" y2="115" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="130" text-anchor="middle" font-size="11" fill="#666">2. 返回实例列表</text>
  <line x1="160" y1="90" x2="530" y2="65" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="350" y="60" text-anchor="middle" font-size="11" fill="#666">3. 调用</text>
  <line x1="160" y1="110" x2="530" y2="145" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 注册虚线 -->
  <line x1="530" y1="75" x2="410" y2="95" stroke="#666" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="470" y="72" text-anchor="middle" font-size="11" fill="#666">注册</text>
  <line x1="530" y1="140" x2="410" y2="115" stroke="#666" stroke-width="1" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
</svg>