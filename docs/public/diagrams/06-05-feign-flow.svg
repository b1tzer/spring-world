<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }</style>
  <!-- OrderController -->
  <rect x="20" y="80" width="140" height="50" rx="6" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="90" y="110" text-anchor="middle">OrderController</text>
  <!-- UserClient 代理 -->
  <rect x="230" y="80" width="140" height="50" rx="6" fill="#fff3e0" stroke="#ffb74d" stroke-width="1.5"/>
  <text x="300" y="110" text-anchor="middle">UserClient 代理</text>
  <!-- LoadBalancer -->
  <rect x="440" y="80" width="160" height="50" rx="6" fill="#e3f2fd" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="520" y="110" text-anchor="middle">LoadBalancer</text>
  <!-- 实例1 -->
  <rect x="660" y="40" width="120" height="45" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="720" y="68" text-anchor="middle">实例1</text>
  <!-- 实例2 -->
  <rect x="660" y="140" width="120" height="45" rx="6" fill="#e8f5e9" stroke="#81c784" stroke-width="1.5"/>
  <text x="720" y="168" text-anchor="middle">实例2</text>
  <!-- 箭头 -->
  <line x1="160" y1="105" x2="230" y2="105" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="195" y="98" text-anchor="middle" font-size="11" fill="#666">调用接口方法</text>
  <line x1="370" y1="95" x2="440" y2="95" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="405" y="88" text-anchor="middle" font-size="11" fill="#666">构造 HTTP</text>
  <line x1="600" y1="90" x2="660" y2="62" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="630" y="65" text-anchor="middle" font-size="11" fill="#666">选择</text>
  <line x1="600" y1="110" x2="660" y2="162" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- 发送请求 -->
  <line x1="370" y1="115" x2="660" y2="62" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="510" y="150" font-size="11" fill="#666">发送请求</text>
  <!-- 解析响应 -->
  <line x1="230" y1="130" x2="160" y2="130" stroke="#666" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="195" y="145" text-anchor="middle" font-size="11" fill="#666">解析响应 JSON</text>
</svg>