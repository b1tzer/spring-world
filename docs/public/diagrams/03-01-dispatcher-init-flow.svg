<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">DispatcherServlet 初始化时序</text>

  <!-- Participants -->
  <rect x="60" y="50" width="130" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="125" y="73" text-anchor="middle" fill="#333">Tomcat 容器</text>
  <rect x="240" y="50" width="160" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="320" y="73" text-anchor="middle" fill="#333">FrameworkServlet</text>
  <rect x="450" y="50" width="160" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="530" y="73" text-anchor="middle" fill="#333">DispatcherServlet</text>
  <rect x="660" y="50" width="110" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="715" y="73" text-anchor="middle" fill="#333">Spring 容器</text>

  <!-- Lifelines -->
  <line x1="125" y1="86" x2="125" y2="490" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="320" y1="86" x2="320" y2="490" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="530" y1="86" x2="530" y2="490" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="715" y1="86" x2="715" y2="490" stroke="#999" stroke-dasharray="4,4"/>

  <!-- Arrow 1: Tomcat -> FrameworkServlet -->
  <line x1="125" y1="120" x2="315" y2="120" stroke="#666" marker-end="url(#arrow1)"/>
  <text x="220" y="115" text-anchor="middle" fill="#333">init()</text>

  <!-- Arrow 2: FrameworkServlet -> Context -->
  <line x1="320" y1="160" x2="710" y2="160" stroke="#666" marker-end="url(#arrow1)"/>
  <text x="515" y="155" text-anchor="middle" fill="#333">创建 WebApplicationContext</text>

  <!-- Arrow 3: FrameworkServlet -> DispatcherServlet -->
  <line x1="320" y1="200" x2="525" y2="200" stroke="#666" marker-end="url(#arrow1)"/>
  <text x="422" y="195" text-anchor="middle" fill="#333">onRefresh(context)</text>

  <!-- Arrow 4: DispatcherServlet -> itself -->
  <path d="M 530 240 L 580 240 L 580 260 L 530 260" fill="none" stroke="#666" marker-end="url(#arrow1)"/>
  <text x="585" y="254" fill="#333">initStrategies()</text>

  <!-- Arrow 5: DispatcherServlet -> Context: getBean HM -->
  <line x1="530" y1="290" x2="710" y2="290" stroke="#666" marker-end="url(#arrow1)"/>
  <text x="620" y="285" text-anchor="middle" fill="#333">getBean(HandlerMapping)</text>

  <!-- Arrow 6: DispatcherServlet -> Context: getBean HA -->
  <line x1="530" y1="330" x2="710" y2="330" stroke="#666" marker-end="url(#arrow1)"/>
  <text x="620" y="325" text-anchor="middle" fill="#333">getBean(HandlerAdapter)</text>

  <!-- Arrow 7: DispatcherServlet -> Context: getBean VR -->
  <line x1="530" y1="370" x2="710" y2="370" stroke="#666" marker-end="url(#arrow1)"/>
  <text x="620" y="365" text-anchor="middle" fill="#333">getBean(ViewResolver)</text>

  <!-- Arrow 8: DispatcherServlet -> Context: getBean HER -->
  <line x1="530" y1="410" x2="710" y2="410" stroke="#666" marker-end="url(#arrow1)"/>
  <text x="620" y="405" text-anchor="middle" fill="#333">getBean(HandlerExceptionResolver)</text>

  <!-- Note -->
  <rect x="420" y="440" width="220" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="530" y="463" text-anchor="middle" fill="#333" font-size="13">九大组件全部就绪</text>
</svg>