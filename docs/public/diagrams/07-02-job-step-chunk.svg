<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Spring Batch 三层模型：Job / Step / Chunk</text>

  <!-- Job -->
  <rect x="250" y="50" width="300" height="50" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">Job 批处理作业</text>

  <!-- Lines from Job to Steps -->
  <line x1="330" y1="100" x2="150" y2="145" stroke="#666" marker-end="url(#arrow)"/>
  <line x1="400" y1="100" x2="400" y2="145" stroke="#666" marker-end="url(#arrow)"/>
  <line x1="470" y1="100" x2="650" y2="145" stroke="#666" marker-end="url(#arrow)"/>

  <!-- Steps -->
  <rect x="60" y="145" width="180" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="2"/>
  <text x="150" y="172" text-anchor="middle" font-size="14" fill="#333">Step 1: 导入数据</text>

  <rect x="310" y="145" width="180" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="2"/>
  <text x="400" y="172" text-anchor="middle" font-size="14" fill="#333">Step 2: 数据校验</text>

  <rect x="560" y="145" width="180" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="2"/>
  <text x="650" y="172" text-anchor="middle" font-size="14" fill="#333">Step 3: 生成报表</text>

  <!-- Step order arrows -->
  <text x="270" y="172" text-anchor="middle" font-size="14" fill="#666">→</text>
  <text x="520" y="172" text-anchor="middle" font-size="14" fill="#666">→</text>

  <!-- Expand Step 1 -->
  <line x1="150" y1="190" x2="150" y2="225" stroke="#666" marker-end="url(#arrow)"/>

  <!-- Chunks under Step 1 -->
  <rect x="20" y="225" width="260" height="140" rx="6" fill="#f5f5f5" stroke="#ccc" stroke-dasharray="4,4"/>
  <text x="150" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#666">Chunks</text>

  <rect x="35" y="260" width="230" height="35" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="150" y="282" text-anchor="middle" font-size="12" fill="#333">Chunk 1: 读1000条 → 处理 → 写入</text>

  <rect x="35" y="305" width="230" height="35" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="150" y="327" text-anchor="middle" font-size="12" fill="#333">Chunk 2: 读1000条 → 处理 → 写入</text>

  <!-- Chunk label -->
  <text x="400" y="280" text-anchor="middle" font-size="13" fill="#666">每1000条数据为一个 Chunk</text>
  <text x="400" y="300" text-anchor="middle" font-size="13" fill="#666">Chunk 内所有数据在同一个事务中写入</text>
  <text x="400" y="320" text-anchor="middle" font-size="13" fill="#666">失败则整个 Chunk 回滚</text>

  <!-- Legend -->
  <rect x="310" y="340" width="12" height="12" rx="2" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="328" y="351" font-size="12" fill="#666">Job</text>
  <rect x="380" y="340" width="12" height="12" rx="2" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="398" y="351" font-size="12" fill="#666">Step</text>
  <rect x="440" y="340" width="12" height="12" rx="2" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="458" y="351" font-size="12" fill="#666">Chunk</text>
</svg>
