<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="as" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#666"/></marker>
    <marker id="ass" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6" fill="#666"/></marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">三级缓存解决循环依赖</text>

  <!-- Participants -->
  <rect x="30" y="40" width="100" height="36" rx="6" fill="#bbdefb" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="80" y="63" text-anchor="middle" font-weight="bold" fill="#333">Spring 容器</text>
  <line x1="80" y1="76" x2="80" y2="590" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="4,3"/>

  <rect x="200" y="40" width="110" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="255" y="63" text-anchor="middle" font-weight="bold" fill="#333">三级缓存</text>
  <line x1="255" y1="76" x2="255" y2="590" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="4,3"/>

  <rect x="400" y="40" width="90" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="445" y="63" text-anchor="middle" font-weight="bold" fill="#333">Bean A</text>
  <line x1="445" y1="76" x2="445" y2="590" stroke="#a5d6a7" stroke-width="1.5" stroke-dasharray="4,3"/>

  <rect x="560" y="40" width="90" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="605" y="63" text-anchor="middle" font-weight="bold" fill="#333">Bean B</text>
  <line x1="605" y1="76" x2="605" y2="590" stroke="#ffcc80" stroke-width="1.5" stroke-dasharray="4,3"/>

  <rect x="700" y="40" width="80" height="36" rx="6" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1.5"/>
  <text x="740" y="63" text-anchor="middle" font-weight="bold" fill="#333">一级缓存</text>
  <line x1="740" y1="76" x2="740" y2="590" stroke="#ce93d8" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Step 1 -->
  <line x1="80" y1="100" x2="435" y2="100" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="260" y="95" text-anchor="middle" fill="#333">1. 实例化 A（new A()）</text>

  <!-- Step 2 -->
  <line x1="445" y1="125" x2="265" y2="125" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="350" y="120" text-anchor="middle" fill="#333">2. 放入 A 的 ObjectFactory</text>

  <!-- Step 3 -->
  <line x1="80" y1="150" x2="435" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="260" y="145" text-anchor="middle" fill="#333">3. 填充属性 → 需要 B</text>

  <!-- Step 4 -->
  <line x1="80" y1="180" x2="595" y2="180" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="340" y="175" text-anchor="middle" fill="#333">4. 实例化 B（new B()）</text>

  <!-- Step 5 -->
  <line x1="605" y1="205" x2="265" y2="205" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="440" y="200" text-anchor="middle" fill="#333">5. 放入 B 的 ObjectFactory</text>

  <!-- Step 6 -->
  <line x1="80" y1="230" x2="595" y2="230" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="340" y="225" text-anchor="middle" fill="#333">6. 填充属性 → 需要 A</text>

  <!-- Step 7 -->
  <line x1="605" y1="260" x2="265" y2="260" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="440" y="255" text-anchor="middle" fill="#333">7. 查找 A → 调用 ObjectFactory</text>

  <!-- Note on L3 -->
  <rect x="160" y="275" width="190" height="30" rx="4" fill="#fff8e1" stroke="#e0c36a" stroke-width="1"/>
  <text x="255" y="295" text-anchor="middle" font-size="11" fill="#666">返回 A（可能是代理版）</text>

  <!-- Step 8 -->
  <line x1="265" y1="310" x2="80" y2="310" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="175" y="305" text-anchor="middle" fill="#333">8. 拿到半成品 A</text>

  <!-- Step 9 -->
  <line x1="80" y1="340" x2="595" y2="340" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="340" y="335" text-anchor="middle" fill="#333">9. 注入 A 到 B，B 初始化完成</text>

  <!-- Step 10 -->
  <line x1="605" y1="370" x2="730" y2="370" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="670" y="365" text-anchor="middle" fill="#333">10. B → 一级缓存</text>

  <!-- Step 11 -->
  <line x1="80" y1="400" x2="435" y2="400" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="260" y="395" text-anchor="middle" fill="#333">11. A 拿到完整 B，注入</text>

  <!-- Step 12 -->
  <line x1="445" y1="430" x2="730" y2="430" stroke="#666" stroke-width="1.5" marker-end="url(#as)"/>
  <text x="590" y="425" text-anchor="middle" fill="#333">12. A → 一级缓存</text>

  <!-- Cache legend -->
  <rect x="30" y="470" width="740" height="110" rx="6" fill="#fafafa" stroke="#eee" stroke-width="1"/>
  <text x="400" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">三级缓存说明</text>

  <rect x="50" y="510" width="16" height="16" rx="3" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1"/>
  <text x="75" y="523" fill="#333" font-size="12"><tspan font-weight="bold">一级</tspan> singletonObjects：完整 Bean（做好的菜）</text>

  <rect x="50" y="535" width="16" height="16" rx="3" fill="#fff8e1" stroke="#e0c36a" stroke-width="1"/>
  <text x="75" y="548" fill="#333" font-size="12"><tspan font-weight="bold">二级</tspan> earlySingletonObjects：半成品引用（先盛一点尝）</text>

  <rect x="50" y="560" width="16" height="16" rx="3" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="75" y="573" fill="#333" font-size="12"><tspan font-weight="bold">三级</tspan> singletonFactories：ObjectFactory（备忘录，需要时再做）</text>
</svg>