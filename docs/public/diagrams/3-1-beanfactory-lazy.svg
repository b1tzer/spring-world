<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13">
  <defs>
    <marker id="bf" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#666"/></marker>
    <marker id="bfs" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto"><path d="M8,0 L0,3 L8,6" fill="#666"/></marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">BeanFactory 懒加载机制</text>

  <!-- Participants -->
  <rect x="50" y="40" width="140" height="36" rx="6" fill="#bbdefb" stroke="#64b5f6" stroke-width="1.5"/>
  <text x="120" y="63" text-anchor="middle" font-weight="bold" fill="#333">BeanFactory</text>
  <line x1="120" y1="76" x2="120" y2="310" stroke="#90caf9" stroke-width="1.5" stroke-dasharray="4,3"/>

  <rect x="500" y="40" width="100" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="550" y="63" text-anchor="middle" font-weight="bold" fill="#333">Bean</text>
  <line x1="550" y1="76" x2="550" y2="310" stroke="#a5d6a7" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Note: 启动完成 -->
  <rect x="30" y="90" width="200" height="30" rx="4" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
  <text x="130" y="110" text-anchor="middle" font-size="12" fill="#666">启动完成，货架是空的</text>

  <!-- Step 1: getBean first time -->
  <line x1="120" y1="140" x2="120" y2="140" stroke="#666" stroke-width="1.5"/>
  <rect x="140" y="128" width="200" height="28" rx="4" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="240" y="147" text-anchor="middle" fill="#333">getBean("userService")</text>

  <!-- Step 2: create bean -->
  <line x1="120" y1="170" x2="540" y2="170" stroke="#666" stroke-width="1.5" marker-end="url(#bf)"/>
  <text x="330" y="165" text-anchor="middle" fill="#333">第一次请求 → 实例化、注入、初始化</text>

  <!-- Step 3: return -->
  <line x1="540" y1="200" x2="130" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#bfs)"/>
  <text x="335" y="195" text-anchor="middle" fill="#333">返回实例</text>

  <!-- Separator -->
  <line x1="30" y1="225" x2="770" y2="225" stroke="#eee" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Step 4: getBean again -->
  <rect x="140" y="240" width="200" height="28" rx="4" fill="#e3f2fd" stroke="#90caf9" stroke-width="1"/>
  <text x="240" y="259" text-anchor="middle" fill="#333">getBean("userService") 再次请求</text>

  <!-- Step 5: from cache -->
  <rect x="30" y="275" width="280" height="30" rx="4" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="170" y="295" text-anchor="middle" font-size="12" fill="#333">直接从单例缓存给你（不重新创建）</text>

  <!-- Note -->
  <rect x="450" y="240" width="320" height="65" rx="6" fill="#fff8e1" stroke="#e0c36a" stroke-width="1"/>
  <text x="610" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">特点</text>
  <text x="610" y="278" text-anchor="middle" font-size="12" fill="#666">✅ 启动快（不提前创建 Bean）</text>
  <text x="610" y="296" text-anchor="middle" font-size="12" fill="#666">⚠️ 第一次请求会慢</text>
</svg>