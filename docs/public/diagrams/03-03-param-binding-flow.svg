<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow5" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">参数绑定流程</text>

  <!-- A: HTTP 请求 -->
  <rect x="20" y="180" width="100" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="70" y="203" text-anchor="middle" fill="#333">HTTP 请求</text>

  <!-- Arrow A->B -->
  <line x1="120" y1="198" x2="155" y2="198" stroke="#666" marker-end="url(#arrow5)"/>

  <!-- B: DispatcherServlet -->
  <rect x="160" y="180" width="120" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="220" y="203" text-anchor="middle" fill="#333">DispatcherServlet</text>

  <!-- Arrow B->C -->
  <line x1="280" y1="198" x2="315" y2="198" stroke="#666" marker-end="url(#arrow5)"/>

  <!-- C: HandlerAdapter -->
  <rect x="320" y="180" width="120" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="380" y="203" text-anchor="middle" fill="#333">HandlerAdapter</text>

  <!-- Arrow C->D -->
  <line x1="440" y1="198" x2="475" y2="198" stroke="#666" marker-end="url(#arrow5)"/>

  <!-- D: 参数解析循环 -->
  <rect x="480" y="165" width="130" height="65" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="545" y="193" text-anchor="middle" fill="#333">参数解析循环</text>
  <text x="545" y="213" text-anchor="middle" fill="#333" font-size="12">遍历方法参数</text>

  <!-- Arrows from D to resolvers (fan out) -->
  <!-- D -> E1 (top) -->
  <line x1="610" y1="175" x2="660" y2="70" stroke="#666" marker-end="url(#arrow5)"/>
  <!-- D -> E2 -->
  <line x1="610" y1="185" x2="660" y2="140" stroke="#666" marker-end="url(#arrow5)"/>
  <!-- D -> E3 -->
  <line x1="610" y1="198" x2="660" y2="210" stroke="#666" marker-end="url(#arrow5)"/>
  <!-- D -> E4 -->
  <line x1="610" y1="210" x2="660" y2="280" stroke="#666" marker-end="url(#arrow5)"/>
  <!-- D -> E5 (bottom) -->
  <line x1="610" y1="220" x2="660" y2="350" stroke="#666" marker-end="url(#arrow5)"/>

  <!-- Resolvers -->
  <rect x="665" y="52" width="130" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="730" y="70" text-anchor="middle" fill="#333" font-size="12">PathVariableResolver</text>
  <text x="730" y="82" text-anchor="middle" fill="#666" font-size="11">deptId = 42</text>

  <rect x="665" y="122" width="130" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="730" y="140" text-anchor="middle" fill="#333" font-size="12">RequestParamResolver</text>
  <text x="730" y="152" text-anchor="middle" fill="#666" font-size="11">source = "system"</text>

  <rect x="665" y="192" width="130" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="730" y="210" text-anchor="middle" fill="#333" font-size="12">RequestHeaderResolver</text>
  <text x="730" y="222" text-anchor="middle" fill="#666" font-size="11">traceId = "abc-123"</text>

  <rect x="665" y="262" width="130" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="730" y="280" text-anchor="middle" fill="#333" font-size="12">RequestBodyResolver</text>
  <text x="730" y="292" text-anchor="middle" fill="#666" font-size="11">dto = UserDTO对象</text>

  <rect x="665" y="332" width="130" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="730" y="350" text-anchor="middle" fill="#333" font-size="12">ServletRequestResolver</text>
  <text x="730" y="362" text-anchor="middle" fill="#666" font-size="11">request = 原始请求</text>

  <!-- Fan in: resolvers -> F -->
  <line x1="665" y1="70" x2="640" y2="140" stroke="#666" stroke-dasharray="3,3" marker-end="url(#arrow5)"/>
  <line x1="665" y1="140" x2="640" y2="155" stroke="#666" stroke-dasharray="3,3"/>
  <line x1="665" y1="210" x2="640" y2="170" stroke="#666" stroke-dasharray="3,3"/>
  <line x1="665" y1="280" x2="640" y2="185" stroke="#666" stroke-dasharray="3,3"/>
  <line x1="665" y1="350" x2="640" y2="200" stroke="#666" stroke-dasharray="3,3"/>

  <!-- Arrow to F -->
  <rect x="480" y="280" width="130" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="545" y="303" text-anchor="middle" fill="#333">收集所有参数值</text>

  <!-- D -> F -->
  <line x1="545" y1="230" x2="545" y2="276" stroke="#666" marker-end="url(#arrow5)"/>

  <!-- F -> G -->
  <line x1="480" y1="298" x2="310" y2="298" stroke="#666" marker-end="url(#arrow5)"/>

  <!-- Arrow from resolvers to F (converge) -->
  <!-- already handled above with dashed lines -->

  <!-- G: 反射调用 -->
  <rect x="160" y="280" width="145" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="232" y="303" text-anchor="middle" fill="#333">反射调用 Controller 方法</text>
</svg>