<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }
    .sub { font-size: 12px; fill: #777; }
    .node-pink { fill: #fce4ec; stroke: #f48fb1; stroke-width: 1.5; }
    .node-blue { fill: #e3f2fd; stroke: #90caf9; stroke-width: 1.5; }
    .node-green { fill: #e8f5e9; stroke: #a5d6a7; stroke-width: 1.5; }
    .node-orange { fill: #fff3e0; stroke: #ffcc80; stroke-width: 1.5; }
    .line { stroke: #666; stroke-width: 1.5; marker-end: url(#arrow); }
  </style>

  <!-- Aspect -->
  <rect x="310" y="20" width="180" height="60" rx="6" class="node-pink"/>
  <text x="400" y="48" text-anchor="middle" font-weight="bold">Aspect 切面</text>

  <!-- Pointcut -->
  <rect x="100" y="150" width="220" height="60" rx="6" class="node-blue"/>
  <text x="210" y="175" text-anchor="middle" font-weight="bold">Pointcut 切点</text>
  <text x="210" y="195" text-anchor="middle" class="sub">哪些方法要拦截</text>

  <!-- Advice -->
  <rect x="480" y="150" width="220" height="60" rx="6" class="node-green"/>
  <text x="590" y="175" text-anchor="middle" font-weight="bold">Advice 通知</text>
  <text x="590" y="195" text-anchor="middle" class="sub">拦截后做什么</text>

  <!-- JoinPoint -->
  <rect x="290" y="270" width="220" height="60" rx="6" class="node-orange"/>
  <text x="400" y="295" text-anchor="middle" font-weight="bold">JoinPoint 连接点</text>
  <text x="400" y="315" text-anchor="middle" class="sub">运行时被拦截的方法</text>

  <!-- Arrows -->
  <line x1="370" y1="80" x2="250" y2="150" class="line"/>
  <line x1="430" y1="80" x2="550" y2="150" class="line"/>
  <line x1="280" y1="210" x2="350" y2="270" class="line"/>
  <line x1="520" y1="210" x2="450" y2="270" class="line"/>
</svg>
