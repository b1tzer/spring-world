<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <rect x="250" y="20" width="300" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="400" y="48" text-anchor="middle" fill="#333" font-size="14">引入 starter</text>
  <line x1="400" y1="65" x2="400" y2="95" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="95" width="380" height="45" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="400" y="123" text-anchor="middle" fill="#333" font-size="14">传递引入 autoconfigure 模块</text>
  <line x1="400" y1="140" x2="400" y2="170" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="180" y="170" width="440" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="400" y="198" text-anchor="middle" fill="#333" font-size="14">AutoConfiguration.imports 注册配置类</text>
  <line x1="400" y1="215" x2="400" y2="245" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="220" y="245" width="360" height="45" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="400" y="273" text-anchor="middle" fill="#333" font-size="14">Spring Boot 扫描到配置类</text>
  <line x1="400" y1="290" x2="400" y2="320" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="220" y="320" width="360" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="400" y="348" text-anchor="middle" fill="#333" font-size="14">@ConditionalOnClass 满足</text>
  <line x1="400" y1="365" x2="400" y2="395" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="395" width="400" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="400" y="423" text-anchor="middle" fill="#333" font-size="14">@ConditionalOnMissingBean 满足</text>
  <line x1="400" y1="440" x2="400" y2="470" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="220" y="470" width="360" height="45" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="400" y="498" text-anchor="middle" fill="#333" font-size="14">从 application.yml 绑定配置</text>
  <line x1="400" y1="515" x2="400" y2="545" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="545" width="300" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="400" y="573" text-anchor="middle" fill="#333" font-size="14">创建 Bean 注入容器</text>
  <line x1="400" y1="590" x2="400" y2="610" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="230" y="610" width="340" height="35" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="400" y="633" text-anchor="middle" fill="#333" font-size="14">用户 @Autowired 直接使用</text>
</svg>
