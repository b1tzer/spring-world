<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380">
  <style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; fill: #333; }</style>
  <!-- Closed 状态 -->
  <circle cx="200" cy="100" r="50" fill="#e8f5e9" stroke="#81c784" stroke-width="2"/>
  <text x="200" y="95" text-anchor="middle" font-weight="bold">Closed</text>
  <text x="200" y="115" text-anchor="middle" font-size="12">关闭</text>
  <!-- Open 状态 -->
  <circle cx="550" cy="100" r="50" fill="#ffcdd2" stroke="#ef5350" stroke-width="2"/>
  <text x="550" y="95" text-anchor="middle" font-weight="bold">Open</text>
  <text x="550" y="115" text-anchor="middle" font-size="12">打开</text>
  <!-- HalfOpen 状态 -->
  <circle cx="375" cy="280" r="55" fill="#fff3e0" stroke="#ffb74d" stroke-width="2"/>
  <text x="375" y="275" text-anchor="middle" font-weight="bold">HalfOpen</text>
  <text x="375" y="295" text-anchor="middle" font-size="12">半开</text>
  <!-- Closed → Closed (调用成功) -->
  <path d="M 200 50 Q 120 30 150 50" stroke="#81c784" stroke-width="1.5" fill="none"/>
  <text x="130" y="40" font-size="11" fill="#666">调用成功</text>
  <!-- Closed → Open -->
  <line x1="250" y1="85" x2="500" y2="85" stroke="#666" stroke-width="1.5"/>
  <polygon points="500,85 490,80 490,90" fill="#666"/>
  <text x="375" y="75" text-anchor="middle" font-size="11" fill="#666">失败率超过阈值</text>
  <!-- Open → Open (拒绝所有) -->
  <path d="M 600 50 Q 680 30 650 50" stroke="#ef5350" stroke-width="1.5" fill="none"/>
  <text x="660" y="40" font-size="11" fill="#666">拒绝所有请求</text>
  <!-- Open → HalfOpen -->
  <line x1="520" y1="145" x2="410" y2="240" stroke="#666" stroke-width="1.5"/>
  <polygon points="410,240 418,233 412,228" fill="#666"/>
  <text x="480" y="200" text-anchor="middle" font-size="11" fill="#666">等待时间到</text>
  <!-- HalfOpen → Closed -->
  <line x1="325" y1="260" x2="220" y2="145" stroke="#666" stroke-width="1.5"/>
  <polygon points="220,145 228,152 222,157" fill="#666"/>
  <text x="255" y="210" text-anchor="middle" font-size="11" fill="#666">探测成功</text>
  <!-- HalfOpen → Open -->
  <line x1="425" y1="260" x2="530" y2="145" stroke="#666" stroke-width="1.5"/>
  <polygon points="530,145 522,152 528,157" fill="#666"/>
  <text x="495" y="210" text-anchor="middle" font-size="11" fill="#666">探测失败</text>
  <!-- 初始状态箭头 -->
  <line x1="120" y1="100" x2="150" y2="100" stroke="#666" stroke-width="1.5"/>
  <polygon points="150,100 140,95 140,105" fill="#666"/>
  <text x="90" y="95" font-size="11" fill="#666">初始</text>
</svg>