<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <!-- Request flow -->
  <text x="400" y="25" text-anchor="middle" fill="#333" font-size="15" font-weight="bold">分布式链路追踪（trace_id 传递）</text>
  <rect x="20" y="50" width="120" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="80" y="78" text-anchor="middle" fill="#333" font-size="14">用户请求</text>
  <line x1="140" y1="72" x2="170" y2="72" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="170" y="40" width="180" height="60" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="260" y="68" text-anchor="middle" fill="#333" font-size="14">网关</text>
  <text x="260" y="88" text-anchor="middle" fill="#666" font-size="12">trace_id=abc123</text>
  <line x1="350" y1="72" x2="380" y2="72" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="380" y="40" width="180" height="60" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="470" y="68" text-anchor="middle" fill="#333" font-size="14">订单服务</text>
  <text x="470" y="88" text-anchor="middle" fill="#666" font-size="12">trace_id=abc123</text>
  <!-- Fork from 订单服务 -->
  <line x1="470" y1="100" x2="470" y2="125" stroke="#666" stroke-width="1.5"/>
  <line x1="350" y1="125" x2="590" y2="125" stroke="#666" stroke-width="1.5"/>
  <line x1="350" y1="125" x2="350" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="125" x2="590" y2="150" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="150" width="180" height="60" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="350" y="178" text-anchor="middle" fill="#333" font-size="14">库存服务</text>
  <text x="350" y="198" text-anchor="middle" fill="#666" font-size="12">trace_id=abc123</text>
  <rect x="500" y="150" width="180" height="60" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="590" y="178" text-anchor="middle" fill="#333" font-size="14">支付服务</text>
  <text x="590" y="198" text-anchor="middle" fill="#666" font-size="12">trace_id=abc123</text>
  <!-- Kibana section -->
  <line x1="40" y1="235" x2="760" y2="235" stroke="#ccc" stroke-width="1" stroke-dasharray="6,4"/>
  <rect x="200" y="250" width="400" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="400" y="268" text-anchor="middle" fill="#333" font-size="14">Kibana: 搜索 trace_id=abc123</text>
  <text x="400" y="285" text-anchor="middle" fill="#666" font-size="12">→ 看到完整调用链日志</text>
</svg>
