<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="ev" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#666"/></marker>
  </defs>

  <text x="400" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">事件机制：发布/订阅</text>

  <!-- Publisher -->
  <rect x="30" y="80" width="160" height="50" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="110" y="100" text-anchor="middle" font-weight="bold" fill="#333">OrderService</text>
  <text x="110" y="118" text-anchor="middle" font-size="12" fill="#666">电台</text>

  <!-- Arrow to tower -->
  <line x1="190" y1="105" x2="310" y2="105" stroke="#666" stroke-width="1.5" marker-end="url(#ev)"/>
  <text x="250" y="97" text-anchor="middle" font-size="12" fill="#666">publishEvent</text>
  <text x="250" y="115" text-anchor="middle" font-size="11" fill="#999">广播</text>

  <!-- ApplicationContext tower -->
  <rect x="320" y="50" width="160" height="80" rx="6" fill="#bbdefb" stroke="#64b5f6" stroke-width="2"/>
  <text x="400" y="80" text-anchor="middle" font-weight="bold" fill="#333">ApplicationContext</text>
  <text x="400" y="100" text-anchor="middle" font-size="12" fill="#666">广播塔</text>
  <text x="400" y="118" text-anchor="middle" font-size="11" fill="#1565c0">事件分发中心</text>

  <!-- Arrow to listener 1 -->
  <line x1="480" y1="80" x2="570" y2="60" stroke="#666" stroke-width="1.5" marker-end="url(#ev)"/>
  <text x="530" y="62" font-size="11" fill="#666">通知</text>

  <!-- Arrow to listener 2 -->
  <line x1="480" y1="105" x2="570" y2="130" stroke="#666" stroke-width="1.5" marker-end="url(#ev)"/>
  <text x="530" y="120" font-size="11" fill="#666">通知</text>

  <!-- Arrow to listener 3 -->
  <line x1="480" y1="120" x2="570" y2="200" stroke="#666" stroke-width="1.5" marker-end="url(#ev)"/>
  <text x="530" y="165" font-size="11" fill="#666">通知</text>

  <!-- Listener 1 -->
  <rect x="580" y="40" width="190" height="40" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1"/>
  <text x="675" y="58" text-anchor="middle" fill="#333">OrderEventListener</text>
  <text x="675" y="73" text-anchor="middle" font-size="11" fill="#666">收音机 1</text>

  <!-- Listener 2 -->
  <rect x="580" y="110" width="190" height="40" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1"/>
  <text x="675" y="128" text-anchor="middle" fill="#333">InventoryEventListener</text>
  <text x="675" y="143" text-anchor="middle" font-size="11" fill="#666">收音机 2</text>

  <!-- Listener 3 -->
  <rect x="580" y="180" width="190" height="40" rx="6" fill="#f3e5f5" stroke="#ce93d8" stroke-width="1"/>
  <text x="675" y="198" text-anchor="middle" fill="#333">NotificationEventListener</text>
  <text x="675" y="213" text-anchor="middle" font-size="11" fill="#666">收音机 3</text>

  <!-- Bottom note -->
  <rect x="120" y="240" width="560" height="45" rx="6" fill="#fff8e1" stroke="#e0c36a" stroke-width="1"/>
  <text x="400" y="260" text-anchor="middle" font-size="13" fill="#333">解耦：发布者不知道谁在听，监听者可以随时增减</text>
  <text x="400" y="278" text-anchor="middle" font-size="12" fill="#666">加新的监听逻辑只需加 @EventListener，OrderService 完全不用改</text>
</svg>