<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="25" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">传统 JVM 模式 vs Native Image 模式</text>

  <!-- JVM 模式 -->
  <text x="200" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#1565c0">传统 JVM 模式</text>

  <rect x="20" y="70" width="100" height="35" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="70" y="92" text-anchor="middle" font-size="12" fill="#333">源代码</text>

  <line x1="120" y1="87" x2="138" y2="87" stroke="#666" marker-end="url(#arrow)"/>

  <rect x="140" y="70" width="110" height="35" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="195" y="92" text-anchor="middle" font-size="12" fill="#333">.class 字节码</text>

  <line x1="250" y1="87" x2="268" y2="87" stroke="#666" marker-end="url(#arrow)"/>

  <rect x="270" y="70" width="90" height="35" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="315" y="92" text-anchor="middle" font-size="12" fill="#333">JVM 加载</text>

  <line x1="360" y1="87" x2="378" y2="87" stroke="#666" marker-end="url(#arrow)"/>

  <rect x="380" y="70" width="90" height="35" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="425" y="87" text-anchor="middle" font-size="11" fill="#333">解释执行</text>
  <text x="425" y="100" text-anchor="middle" font-size="10" fill="#666">→ JIT 热点编译</text>

  <!-- Native Image 模式 -->
  <text x="600" y="55" text-anchor="middle" font-size="14" font-weight="bold" fill="#2e7d32">Native Image 模式</text>

  <rect x="440" y="150" width="100" height="35" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="490" y="172" text-anchor="middle" font-size="12" fill="#333">源代码</text>

  <line x1="540" y1="167" x2="558" y2="167" stroke="#666" marker-end="url(#arrow)"/>

  <rect x="560" y="150" width="100" height="35" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="610" y="172" text-anchor="middle" font-size="12" fill="#333">AOT 分析</text>

  <line x1="660" y1="167" x2="678" y2="167" stroke="#666" marker-end="url(#arrow)"/>

  <rect x="680" y="150" width="100" height="35" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="730" y="172" text-anchor="middle" font-size="12" fill="#333">闭包分析</text>

  <!-- Continue -->
  <line x1="490" y1="185" x2="490" y2="210" stroke="#666" marker-end="url(#arrow)" transform="rotate(0)"/>

  <rect x="440" y="215" width="120" height="35" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="500" y="237" text-anchor="middle" font-size="12" fill="#333">编译为机器码</text>

  <line x1="560" y1="232" x2="578" y2="232" stroke="#666" marker-end="url(#arrow)"/>

  <rect x="580" y="215" width="120" height="35" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="640" y="232" text-anchor="middle" font-size="12" fill="#333">可执行文件</text>
  <text x="640" y="245" text-anchor="middle" font-size="10" fill="#666">不需要 JVM</text>

  <!-- Comparison table -->
  <rect x="20" y="210" width="380" height="55" rx="6" fill="#f5f5f5" stroke="#ccc"/>
  <text x="30" y="230" font-size="12" fill="#333">启动: 6-15s → 0.05-0.5s</text>
  <text x="30" y="248" font-size="12" fill="#333">内存: 200-500MB → 30-100MB</text>
  <text x="30" y="260" font-size="12" fill="#333">峰值性能: JIT 更优 | Native 启动快、内存省</text>
</svg>
