<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">Spring 测试金字塔</text>

  <!-- Pyramid layers - from bottom to top -->
  <!-- Bottom: 单元测试 (wide) -->
  <polygon points="100,280 700,280 620,210 180,210" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="2"/>
  <text x="400" y="255" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">单元测试</text>
  <text x="400" y="275" text-anchor="middle" font-size="12" fill="#666">快 · 多 · 不需要 Spring 容器</text>

  <!-- Middle: 集成测试 -->
  <polygon points="180,210 620,210 540,130 260,130" fill="#fff3e0" stroke="#ffcc80" stroke-width="2"/>
  <text x="400" y="175" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">集成测试</text>
  <text x="400" y="195" text-anchor="middle" font-size="12" fill="#666">中等速度 · 验证组件协作</text>

  <!-- Top: 端到端测试 (narrow) -->
  <polygon points="260,130 540,130 460,60 340,60" fill="#e3f2fd" stroke="#90caf9" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">端到端测试</text>
  <text x="400" y="115" text-anchor="middle" font-size="12" fill="#666">慢 · 少 · 验证完整流程</text>

  <!-- Right side annotations -->
  <!-- 单元测试 -->
  <line x1="700" y1="245" x2="730" y2="245" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="732" y="230" width="60" height="30" rx="4" fill="#f5f5f5" stroke="#ccc"/>
  <text x="762" y="250" text-anchor="middle" font-size="11" fill="#333">@Mock</text>

  <!-- 集成测试 -->
  <line x1="620" y1="170" x2="730" y2="170" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="732" y="155" width="60" height="30" rx="4" fill="#f5f5f5" stroke="#ccc"/>
  <text x="762" y="175" text-anchor="middle" font-size="11" fill="#333">@SpringBoot</text>

  <!-- 端到端测试 -->
  <line x1="540" y1="95" x2="730" y2="95" stroke="#666" marker-end="url(#arrow)"/>
  <rect x="732" y="80" width="60" height="30" rx="4" fill="#f5f5f5" stroke="#ccc"/>
  <text x="762" y="100" text-anchor="middle" font-size="11" fill="#333">真实环境</text>

  <!-- Key insight -->
  <rect x="100" y="295" width="600" height="40" rx="6" fill="#fff8e1" stroke="#ffe082"/>
  <text x="400" y="315" text-anchor="middle" font-size="13" fill="#666">单元测试：@Mock + @InjectMocks ｜ 集成测试：@SpringBootTest + Testcontainers ｜ 端到端：真实环境部署</text>
  <text x="400" y="330" text-anchor="middle" font-size="12" fill="#999">测试的最终目标不是覆盖率数字，而是信心</text>
</svg>
