<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">
  <defs>
    <marker id="arrow7" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>

  <text x="400" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">@ResponseBody 响应写入时序</text>

  <!-- Participants -->
  <rect x="30" y="50" width="120" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="90" y="73" text-anchor="middle" fill="#333">DispatcherServlet</text>
  <rect x="210" y="50" width="200" height="36" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="310" y="73" text-anchor="middle" fill="#333">RequestResponseBodyMethodProcessor</text>
  <rect x="470" y="50" width="160" height="36" rx="6" fill="#e8f5e9" stroke="#a5d6a7"/>
  <text x="550" y="73" text-anchor="middle" fill="#333">HttpMessageConverter</text>
  <rect x="690" y="50" width="100" height="36" rx="6" fill="#e3f2fd" stroke="#90caf9"/>
  <text x="740" y="73" text-anchor="middle" fill="#333">HttpServletResponse</text>

  <!-- Lifelines -->
  <line x1="90" y1="86" x2="90" y2="350" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="310" y1="86" x2="310" y2="350" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="550" y1="86" x2="550" y2="350" stroke="#999" stroke-dasharray="4,4"/>
  <line x1="740" y1="86" x2="740" y2="350" stroke="#999" stroke-dasharray="4,4"/>

  <!-- 1: DA -> RRRP -->
  <line x1="90" y1="120" x2="305" y2="120" stroke="#666" marker-end="url(#arrow7)"/>
  <text x="197" y="115" text-anchor="middle" fill="#333">handleReturnValue(user)</text>

  <!-- 2: RRRP -> itself (determine MediaType) -->
  <path d="M 310 160 L 380 160 L 380 180 L 310 180" fill="none" stroke="#666" marker-end="url(#arrow7)"/>
  <text x="390" y="174" fill="#333">确定 MediaType（根据 Accept 头）</text>

  <!-- 3: RRRP -> itself (find Converter) -->
  <path d="M 310 210 L 380 210 L 380 230 L 310 230" fill="none" stroke="#666" marker-end="url(#arrow7)"/>
  <text x="390" y="224" fill="#333">查找匹配的 HttpMessageConverter</text>

  <!-- 4: RRRP -> HMC -->
  <line x1="310" y1="260" x2="545" y2="260" stroke="#666" marker-end="url(#arrow7)"/>
  <text x="427" y="255" text-anchor="middle" fill="#333">write(user, mediaType, response)</text>

  <!-- 5: HMC -> Resp -->
  <line x1="550" y1="300" x2="735" y2="300" stroke="#666" marker-end="url(#arrow7)"/>
  <text x="642" y="295" text-anchor="middle" fill="#333">写入序列化后的数据</text>

  <!-- Note -->
  <rect x="560" y="320" width="250" height="30" rx="6" fill="#fff3e0" stroke="#ffcc80"/>
  <text x="685" y="340" text-anchor="middle" fill="#333" font-size="12">Content-Type: application/json</text>
</svg>