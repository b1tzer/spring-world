<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#666"/>
    </marker>
  </defs>
  <rect x="250" y="20" width="300" height="45" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="400" y="48" text-anchor="middle" fill="#333" font-size="14">Spring Boot 启动</text>
  <line x1="400" y1="65" x2="400" y2="90" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="90" width="260" height="45" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="400" y="118" text-anchor="middle" fill="#333" font-size="14">创建 Environment</text>
  <line x1="400" y1="135" x2="400" y2="160" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="160" width="300" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="400" y="188" text-anchor="middle" fill="#333" font-size="14">加载 application.yml</text>
  <line x1="400" y1="205" x2="400" y2="230" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="230" width="380" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="400" y="258" text-anchor="middle" fill="#333" font-size="14">加载 application-{profile}.yml</text>
  <line x1="400" y1="275" x2="400" y2="300" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="300" width="380" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="400" y="328" text-anchor="middle" fill="#333" font-size="14">加载系统属性 / 环境变量</text>
  <line x1="400" y1="345" x2="400" y2="370" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="230" y="370" width="340" height="45" rx="6" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="1.5"/>
  <text x="400" y="398" text-anchor="middle" fill="#333" font-size="14">加载命令行参数</text>
  <line x1="400" y1="415" x2="400" y2="440" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="180" y="440" width="440" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="400" y="468" text-anchor="middle" fill="#333" font-size="14">合并所有配置源（按优先级覆盖）</text>
  <line x1="400" y1="485" x2="400" y2="510" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="210" y="510" width="380" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="400" y="538" text-anchor="middle" fill="#333" font-size="14">@ConfigurationProperties 绑定</text>
  <line x1="400" y1="555" x2="400" y2="580" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="580" width="240" height="45" rx="6" fill="#fff3e0" stroke="#ffcc80" stroke-width="1.5"/>
  <text x="400" y="608" text-anchor="middle" fill="#333" font-size="14">JSR-303 校验</text>
  <line x1="400" y1="625" x2="400" y2="650" stroke="#666" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="280" y="650" width="240" height="35" rx="6" fill="#e3f2fd" stroke="#90caf9" stroke-width="1.5"/>
  <text x="400" y="673" text-anchor="middle" fill="#333" font-size="14">Bean 可用</text>
</svg>
